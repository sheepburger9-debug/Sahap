<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1F1B">
<meta name="description" content="سحاب: اطلب أكلك من أقرب المطاعم">
<title>سحاب</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23F2A511'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle' fill='%231A1F1B'%3Eس%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1A1F1B; --ink-2:#5B645D; --line:#DDE3D8;
  --bg:#EEF2EA; --card:#FFFFFF;
  --saffron:#F2A511; --saffron-ink:#2A1C00;
  --tomato:#B8402A; --olive:#3E5B3A;
  --r:14px; --col-w:75%;
  /* نظام المسافات الموحد: يكبر مع الشاشة */
  --gap-sm:12px; --gap-md:clamp(14px,3.5vw,22px); --gap-lg:clamp(22px,6vw,32px);
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;max-width:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"Reem Kufi",system-ui,sans-serif;margin:0;line-height:1.25}
p{margin:0}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
a{color:inherit}
input,textarea{font:inherit;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--saffron);outline-offset:0;border-color:transparent}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
label{display:block;font-size:13px;color:var(--ink-2);margin:14px 0 6px}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 24px}
body[data-page="home"] .wrap,body[data-page="restaurant"] .wrap{padding-bottom:110px}
.hidden{display:none!important}
.grow{flex:1;min-width:0}
.meta{font-size:13px;color:var(--ink-2)}
.err{color:var(--tomato);font-size:14px;min-height:0;margin-top:10px}
.sec{font-size:19px;margin:var(--gap-lg) 0 var(--gap-sm)}
.sub{margin:-6px 0 10px}

.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 6px;min-height:0}
.ttl{font-size:26px;font-weight:700}
.brand{font-family:"Reem Kufi",sans-serif;font-size:24px;font-weight:700;letter-spacing:0;line-height:1.2;display:inline-block;white-space:nowrap;flex-shrink:0}
.homelink{flex:none;width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.homelink svg,.tabbar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;border-radius:999px;padding:13px 20px;font-weight:600;width:100%;text-decoration:none}
.btn.primary{background:var(--saffron);color:var(--saffron-ink)}
.btn.ghost{background:transparent;border:1px solid var(--ink);color:var(--ink)}
.btn.auto{width:auto}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{display:block;margin:16px auto 0;color:var(--olive);font-weight:600;padding:8px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;text-decoration:none;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

.search{margin:4px 0 6px}

.banners{display:flex;gap:12px;overflow-x:auto;margin:6px -16px 0;padding:0 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.banners::-webkit-scrollbar{display:none}
.banner{flex:0 0 88%;scroll-snap-align:start;position:relative;overflow:hidden;min-height:176px;border-radius:20px;background:var(--saffron);color:var(--saffron-ink);padding:20px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;text-decoration:none}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.3}
.banner > *{position:relative}
.banner .bt{font-family:"Reem Kufi",sans-serif;font-size:24px;font-weight:700;line-height:1.2}
/* كروت الأقسام التسويقية أعلى الرئيسية: مربعة 1:1 ومستقلة عن كروت المطاعم */
.mkt-strip{display:flex;gap:var(--gap-sm);overflow-x:auto;margin:0 -16px var(--gap-lg);padding:4px 16px 8px;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.mkt-strip::-webkit-scrollbar{display:none}
.mkt-card{position:relative;flex:0 0 min(44vw,188px);aspect-ratio:1/1;overflow:hidden;border:0;border-radius:18px;background:linear-gradient(135deg,#3E5B3A,#1A1F1B);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;text-align:start;box-shadow:0 6px 16px rgba(26,31,27,.14);scroll-snap-align:start;transition:transform .2s ease}
.mkt-card:active{transform:scale(.98)}
.mkt-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.mkt-card::after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(to top,rgba(20,24,20,.85) 0%,rgba(20,24,20,.35) 45%,rgba(20,24,20,0) 70%)}
.mkt-card-fb{position:absolute;inset:0;display:grid;place-items:center;font-family:"Reem Kufi",sans-serif;font-size:64px;color:rgba(255,255,255,.22)}
.mkt-card{text-decoration:none}
.mkt-card-n{display:block;font-size:15px;font-weight:700;line-height:1.3}
.mkt-card-o{display:block;font-size:12px;font-weight:500;opacity:.9;margin-top:2px;line-height:1.35}
.mkt-card-t{position:relative;z-index:1;padding:12px 14px;font-family:"Reem Kufi",sans-serif;font-size:17px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.block{margin:0 0 var(--gap-lg);scroll-margin-top:72px}

.block .rail{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.col{flex:0 0 86%;min-width:0;scroll-snap-align:start;display:flex;flex-direction:column;gap:12px}
.col .rcard{margin:0}
.block .rail::-webkit-scrollbar{display:none}
.mini{flex:0 0 150px;text-decoration:none;display:flex;flex-direction:column;gap:4px}
.cover{height:96px;border-radius:12px;background:#D9E1D2;overflow:hidden;display:grid;place-items:center;font-family:"Reem Kufi",sans-serif;font-size:32px;color:var(--olive)}
.cover img{width:100%;height:100%;object-fit:cover}
.mini strong{font-size:15px}
/* كارت المطعم: نص على الشمال، والصورة في مربع على اليمين، والعرض فوق الصورة */
.rcard{display:flex;align-items:stretch;min-height:104px;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;margin:0 0 12px}
.rcard-img{position:relative;flex:0 0 40%;min-height:104px;border-inline-start:1px solid var(--line);background:#fff;overflow:hidden;display:grid;place-items:center}
.rcard-img img{display:block;width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.rcard-fb{font-family:"Reem Kufi",sans-serif;font-size:32px;color:var(--olive)}
.rcard-img .badge{position:absolute;bottom:6px;left:6px;margin:0;font-weight:700;font-size:12px;padding:3px 10px;z-index:1}
.rcard-img .rcard-logo{position:absolute;inset:auto;top:6px;right:6px;width:44px;height:44px;border-radius:10px;object-fit:cover;background:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2);z-index:1}
.rcard-fav{position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;z-index:1;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.rcard-fav svg{width:16px;height:16px;fill:#5B645D}
.rcard-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:12px 14px}
.rcard .rname{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:26px}
.rcard-top .badge{margin:0;min-width:0;max-width:calc(100% - 34px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;font-size:12px;padding:3px 10px;line-height:1.4}
.rcard-top .rcard-fav{position:static;flex:none;width:26px;height:26px}
.rcard-line{font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard-line .star{color:var(--saffron)}
.ad{display:block;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:var(--gap-md) 0}
.ad img{display:block;width:100%;height:auto;max-height:200px;object-fit:cover}
.ad-body{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.ad-tag{font-size:11px;color:var(--ink-2)}
.ad-title{font-family:"Reem Kufi",sans-serif;font-size:17px;font-weight:700}
/* ===== أنواع اللافتات الخمسة ===== */
.ad,.ad *{max-width:100%;overflow-wrap:anywhere}
.ad:focus-visible{outline:3px solid var(--saffron);outline-offset:3px}

/* hero: بانر رئيسي عريض */
.ad--hero{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:176px;border:0;background:var(--ink);color:#EEF2EA}
.ad--hero img{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:cover;opacity:.45}
.ad--hero .ad-body{position:relative;padding:20px;display:flex;flex-direction:column;gap:4px}
.ad--hero .ad-title{font-size:24px;line-height:1.2;color:#fff}
.ad--hero .meta,.ad--hero .ad-tag{color:#D9E1D2}

/* horizontal: صورة جانبية والنص بجانبها */
.ad--horizontal{display:flex;align-items:stretch;min-height:96px;border:0;background:#FFF3D6;color:var(--ink)}
.ad--horizontal img{position:static;width:112px;flex:0 0 112px;height:auto;max-height:none;object-fit:cover}
.ad--horizontal .ad-body{flex:1;min-width:0;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;gap:2px}

/* square: لافتة مربعة 1:1 */
.ad--square{position:relative;display:flex;flex-direction:column;justify-content:flex-end;aspect-ratio:1/1;width:100%;max-width:360px;margin-inline:auto;border:0;background:var(--olive);color:#EEF2EA}
.ad--square img{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:cover;opacity:.55}
.ad--square .ad-body{position:relative;padding:18px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(transparent,rgba(26,31,27,.85))}
.ad--square .ad-title{font-size:20px;line-height:1.25;color:#fff}
.ad--square .meta,.ad--square .ad-tag{color:#D9E1D2}

/* vertical: لافتة طولية للمساحات الضيقة */
.ad--vertical{position:relative;display:flex;flex-direction:column;justify-content:flex-end;aspect-ratio:2/3;width:100%;max-width:240px;margin-inline:auto;border:0;background:var(--saffron);color:var(--saffron-ink)}
.ad--vertical img{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:cover;opacity:.5}
.ad--vertical .ad-body{position:relative;padding:14px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(transparent,rgba(42,28,0,.75))}
.ad--vertical .ad-title{font-size:18px;line-height:1.25;color:#fff}
.ad--vertical .meta,.ad--vertical .ad-tag{color:#FFF3D6}

/* featured: لافتة مميزة بإطار واضح وشارة «مطعم مميز» */
.ad--featured{border:2px solid var(--saffron);background:#FFFBF0;color:var(--ink);box-shadow:0 6px 18px rgba(242,165,17,.22)}
.ad--featured img{width:100%;height:140px;max-height:none;object-fit:cover}
.ad--featured .ad-body{padding:14px 16px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.ad--featured .ad-tag{background:var(--saffron);color:var(--saffron-ink);font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px}
.ad--featured .ad-title{font-size:18px}

/* تجاوب الشاشات الصغيرة والكبيرة */
@media (max-width:360px){
  .ad--hero{min-height:150px}
  .ad--hero .ad-title{font-size:20px}
  .ad--horizontal img{width:88px;flex-basis:88px}
  .ad--square .ad-title{font-size:18px}
}
@media (min-width:600px){
  .ad--hero{min-height:200px}
}

.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.rname{font-size:16px;font-weight:600}
.thumb{width:72px;height:72px;flex:none;border-radius:12px;background:#D9E1D2;object-fit:cover;display:grid;place-items:center;font-size:28px;color:var(--olive);font-family:"Reem Kufi",sans-serif}
img.thumb{display:block}
.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;margin-top:4px}

.hero{height:170px;border-radius:18px;overflow:hidden;background:var(--olive);display:grid;place-items:center;margin-top:4px}
.hero img{width:100%;height:100%;object-fit:cover}
.hero-fb{font-family:"Reem Kufi",sans-serif;font-size:72px;color:#EEF2EA}
.rhead{font-size:26px;margin:14px 0 4px}
.facts{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:var(--ink-2)}
.offerbox{background:#fff;border-radius:var(--r);padding:14px;margin-top:14px;border-inline-start:4px solid var(--saffron)}
.menucats{position:sticky;top:44px;z-index:4;background:var(--bg);padding-bottom:4px}

.product{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.price{font-weight:700;color:var(--olive)}
.pricerow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.addbtn{background:var(--ink);color:#fff;border-radius:999px;padding:7px 16px;font-size:14px;font-weight:600}
.qty{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.qty button{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;font-size:18px;line-height:1}
.qty span{min-width:20px;text-align:center;font-weight:700}

.review{padding:12px 0;border-bottom:1px solid var(--line)}
.stars{color:var(--saffron);letter-spacing:1px}

.cartbar{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));inset-inline:12px;max-width:496px;margin:0 auto;background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:9;box-shadow:0 10px 30px rgba(20,28,22,.25)}

.topbar-end{display:flex;align-items:center;gap:8px;flex:none}
.cartbtn{position:relative;flex:none;width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
.cartbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cartcount{position:absolute;top:-4px;inset-inline-start:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--saffron);color:var(--saffron-ink);font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.tabbar{display:none;position:fixed;bottom:max(12px,env(safe-area-inset-bottom));inset-inline:12px;max-width:496px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:22px;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;box-shadow:0 8px 24px rgba(20,28,22,.12);z-index:10}
body[data-page="home"] .tabbar{display:grid}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;color:var(--ink-2);text-decoration:none;font-size:12px;line-height:1.3;padding:8px 2px;border-radius:16px;transition:background-color .2s ease,color .2s ease}
.tabbar a[aria-current="page"]{color:var(--ink);font-weight:700;background:#FFF3D6}

.backdrop{position:fixed;inset:0;background:rgba(14,20,15,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px max(22px,env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet h2{font-size:22px;margin-bottom:4px}
.sum{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.sum.total{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700;font-size:17px}
.opt{display:flex;gap:10px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:8px 0;font-size:15px;color:var(--ink);cursor:pointer}
.opt input{width:auto;accent-color:var(--ink)}
.opt small{display:block;color:var(--ink-2)}
fieldset{border:0;margin:14px 0 0;padding:0}
legend{font-size:13px;color:var(--ink-2);padding:0;margin-bottom:4px}
.inline{display:flex;gap:8px}
.inline input{flex:1}

.order{background:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px}
.between{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pill{display:inline-block;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--bg);margin-top:8px}
.order .btn{margin-top:10px}

.auth{background:#fff;border-radius:18px;padding:18px;margin-top:8px}
.points{background:#fff;border-radius:var(--r);padding:16px;margin:10px 0 4px;font-size:16px}
.points b{font-family:"Reem Kufi",sans-serif;font-size:26px;color:var(--olive)}
.acct form{background:#fff;border-radius:18px;padding:16px;margin-top:10px}
.acct .btn{margin-top:16px}

.toast{position:fixed;top:12px;inset-inline:12px;max-width:496px;margin:0 auto;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;z-index:40;font-size:14px}
.empty{text-align:center;padding:48px 16px;color:var(--ink-2)}
.center{text-align:center}

@media (orientation: landscape){
  .wrap{padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right))}
  .topbar{padding-inline:0}
  .tabbar,.cartbar,.toast{inset-inline-start:max(12px,env(safe-area-inset-left));inset-inline-end:max(12px,env(safe-area-inset-right))}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main id="app" class="wrap" aria-live="polite"></main>

<div id="cartbar" class="cartbar hidden" role="region" aria-label="السلة"></div>

<script>
/* ============ الإعداد ============ */
// المفتاح ده publishable (عام وآمن للكود العام). الأسرار موجودة على سوبابيز بس.
const SB_URL = 'https://hazyajkncrdfewkvnoww.supabase.co';
const SB_KEY = 'sb_publishable_9Kf6dTQTqI9h7-yGALWMWg_bjPzM6Zu';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

function openSheet(html, onMount) {
  closeSheet();
  const bd = document.createElement('div');
  bd.className = 'backdrop';
  bd.id = 'sheet';
  bd.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  bd.addEventListener('click', (e) => { if (e.target === bd) closeSheet(); });
  document.body.appendChild(bd);
  onMount?.(bd.querySelector('.sheet'));
}
function closeSheet() { $('#sheet')?.remove(); }

async function invokeError(error, fallback) {
  if (!error) return fallback;
  try { const j = await error.context.json(); return j.error || fallback; } catch { return fallback; }
}

function translateAuthError(msg = '') {
  if (/Invalid login/i.test(msg)) return 'الإيميل أو كلمة السر غلط';
  if (/already registered/i.test(msg)) return 'الإيميل ده مسجل قبل كده، ادخل من الأول';
  if (/least 6/i.test(msg)) return 'كلمة السر لازم تكون 6 حروف على الأقل';
  if (/valid email/i.test(msg)) return 'اكتب إيميل صحيح';
  return msg || 'حصلت مشكلة، حاول تاني';
}

async function loadAds() {
  const { data, error } = await sb.rpc('get_eligible_ads');
  if (error || !data) return new Map();
  const map = new Map();
  for (const a of data) {
    if (!map.has(a.placement_code)) map.set(a.placement_code, []);
    map.get(a.placement_code).push(a);
  }
  return map;
}

const safeUrl = (u) => (/^https?:\/\//i.test(u || '') ? u : '');

const PER_COL = 3; // عدد المطاعم رأسياً في كل عمود (الاتفاق الحالي)
function blockHtml(bl, byId) {
  const items = bl.members.map((m) => ({ r: byId.get(m.restaurant_id), m })).filter((x) => x.r);
  if (!items.length) return '';
  // كل عمود فيه PER_COL مطاعم فوق بعض، والأعمدة جنب بعض والريل بيتسحب أفقياً
  const cols = [];
  for (let i = 0; i < items.length; i += PER_COL) cols.push(items.slice(i, i + PER_COL));
  return `<section class="block" id="blk-${esc(bl.id)}">
    <h2 class="sec">${esc(bl.title)}</h2>
    ${bl.subtitle ? `<p class="meta sub">${esc(bl.subtitle)}</p>` : ''}
    <div class="rail">${cols.map((c) => `<div class="col">${c.map(({ r, m }) => restRowHtml(r, blockBadge(bl, m))).join('')}</div>`).join('')}</div>
  </section>`;
}

function adHtml(ad) {
  if (!ad) return '';

  const formats = ['hero', 'horizontal', 'square', 'vertical', 'featured'];
  const rawFormat = String(ad.creative_format || 'hero').toLowerCase();
  const format = formats.includes(rawFormat) ? rawFormat : 'hero';

  const img = safeUrl(ad.creative_image_url);
  const restaurantSlug = String(ad.restaurant_slug || '').trim();

  // روابط المطاعم داخل الموقع يجب أن تفتح صفحة المطعم داخليًا.
  const internalUrl = restaurantSlug
    ? `#/r/${encodeURIComponent(restaurantSlug)}`
    : '';

  const externalUrl = safeUrl(ad.target_url);
  const url = internalUrl || externalUrl;

  const title = ad.creative_title || ad.restaurant_name || 'اكتشف المطعم';
  const dataAttrs = `data-campaign-id="${esc(ad.campaign_id || '')}" data-placement="${esc(ad.placement_code || '')}"`;

  const tag = format === 'featured'
    ? '<span class="ad-tag">مطعم مميز</span>'
    : '<span class="ad-tag">إعلان</span>';

  const inner = `
    ${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : ''}
    <div class="ad-body">
      ${tag}
      <strong class="ad-title">${esc(title)}</strong>
      ${ad.creative_text
        ? `<p class="meta">${esc(ad.creative_text)}</p>`
        : ''}
      ${restaurantSlug
        ? '<span class="meta">افتح صفحة المطعم</span>'
        : ''}
    </div>
  `;

  if (!url) {
    return `<div class="ad ad--${format}" ${dataAttrs}>${inner}</div>`;
  }

  if (internalUrl) {
    return `<a class="ad ad--${format}" ${dataAttrs} href="${esc(url)}"
      aria-label="${esc(title)}">${inner}</a>`;
  }

  return `<a class="ad ad--${format}" ${dataAttrs} href="${esc(url)}"
    target="_blank" rel="noopener sponsored"
    aria-label="${esc(title)}">${inner}</a>`;
}

/* ===== تسجيل الظهور والنقر (CPM / CPC) ===== */
let viewSeq = 0; // رقم كل عرض للصفحة، عشان الظهور يتسجل مرة واحدة لكل زيارة
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const newEventKey = () => (crypto && crypto.randomUUID
  ? crypto.randomUUID()
  : 'ev-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2));
const SESSION_RAW = newEventKey(); // معرف جلسة عشوائي لكل تحميل صفحة، من غير أي بيانات شخصية
let sessionHashP = null;
function sessionHash() {
  if (!sessionHashP) sessionHashP = (async () => {
    try {
      if (crypto && crypto.subtle) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(SESSION_RAW));
        return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
      }
    } catch (_) {}
    return SESSION_RAW;
  })();
  return sessionHashP;
}
// نفس event_key في كل إعادة محاولة، والأخطاء ما بتعطلش الموقع
async function sendAdEvent(fn, params, attempts = 3) {
  for (let i = 0; i < attempts; i++) {
    try {
      const { error } = await sb.rpc(fn, params);
      if (!error) return true;
    } catch (_) {}
    await new Promise((r) => setTimeout(r, 500 * 2 ** i));
  }
  return false;
}

const recordedImpressions = new Set();
const impressionIO = ('IntersectionObserver' in window) ? new IntersectionObserver((entries) => {
  for (const e of entries) {
    const el = e.target;
    el.__ratio = e.intersectionRatio;
    if (el.dataset.impressionDone) continue;
    if (e.intersectionRatio >= 0.5) {
      if (!el.__timer) el.__timer = setTimeout(() => { el.__timer = null; fireImpression(el); }, 1000);
    } else if (el.__timer) {
      clearTimeout(el.__timer);
      el.__timer = null;
    }
  }
}, { threshold: [0, 0.25, 0.5, 0.75, 1] }) : null;

async function fireImpression(el) {
  if (el.dataset.impressionDone || !el.isConnected) return;
  const pct = Math.round((el.__ratio || 0) * 100);
  if (pct < 50) return;
  const campaignId = el.dataset.campaignId;
  if (!UUID_RE.test(campaignId || '')) return;
  const dedupe = `${el.dataset.view}|${el.dataset.placement}|${campaignId}`;
  el.dataset.impressionDone = '1';
  impressionIO.unobserve(el);
  if (recordedImpressions.has(dedupe)) return;
  recordedImpressions.add(dedupe);
  const params = {
    p_campaign_id: campaignId,
    p_session_hash: await sessionHash(),
    p_visible_percent: pct,
    p_event_key: newEventKey(),
  };
  sendAdEvent('track_ad_impression', params);
}

function observeAds(root = document) {
  if (!impressionIO || !root) return;
  root.querySelectorAll('.ad[data-campaign-id]').forEach((el) => {
    if (el.dataset.impressionDone) return;
    el.dataset.view = String(viewSeq);
    impressionIO.observe(el);
  });
}

// النقر: يسجل ولا يمنع التنقل (الروابط الداخلية والخارجية زي ما هي)
// النقرة تُحتسب مرة واحدة لكل حملة في كل عرض للصفحة، والضغط المتكرر ما بيخصمش تاني
const clickedKeys = new Set();
document.addEventListener('click', (e) => {
  const a = e.target && e.target.closest ? e.target.closest('a.ad[data-campaign-id]') : null;
  if (!a) return;
  const campaignId = a.dataset.campaignId;
  if (!UUID_RE.test(campaignId || '')) return;
  const viewKey = `${a.dataset.view || viewSeq}|${campaignId}`;
  if (clickedKeys.has(viewKey)) return;
  clickedKeys.add(viewKey);
  const eventKey = `click:${SESSION_RAW}:${viewKey}`;
  sessionHash().then((h) => sendAdEvent('track_ad_click', {
    p_campaign_id: campaignId,
    p_session_hash: h,
    p_event_key: eventKey,
  }, 2));
});

// ترتيب الصفحة من homepage_layout_items (الإعلانات بتتعرض في موضعها)
// skipCodes: مواضع بتتعرض في مكان محدد بره الترتيب
function layoutHtml(layout, blocks, byId, ads, skipCodes = new Set(), used = null) {
  const blockById = new Map(blocks.map((b) => [b.id, b]));
  // التخطيط هو المصدر الوحيد: البلوك اللي مش في التخطيط ما يتعرضش أبداً
  const items = layout;
  return items.map((it) => {
    if (it.item_type === 'restaurant_block') {
      const bl = blockById.get(it.block_id);
      return bl ? blockHtml(bl, byId) : '';
    }
    if (it.item_type === 'ad_banner') {
      const code = it.ad_placements && it.ad_placements.code;
      if (!code || skipCodes.has(code)) return '';
      return adsHtml(used ? pickAds(ads, code, used) : ads.get(code));
    }
    return '';
  }).join('');
}

/* ============ الراوتر ============ */
const ROUTES = [
  [/^$/, viewHome, false, 'home'],
  [/^home$/, viewHome, false, 'home'],
  [/^restaurants$/, viewRestaurants, false, 'restaurants'],
  [/^r\/([^/]+)$/, viewRestaurant, false, 'restaurants'],
  [/^g\/([^/]+)$/, viewGroup, false, ''],
  [/^orders$/, viewOrders, true, 'orders'],
  [/^account$/, viewAccount, true, 'account'],
  [/^login$/, viewLogin, false, ''],
];

function route() {
  clearInterval(pollTimer);
  closeSheet();
  cartbar.classList.add('hidden');
  const raw = location.hash.replace(/^#\/?/, '');
  const path = raw.split('?')[0];
  refreshCartSummary().then(updateCartBtns);
  document.body.dataset.page = (path === '' || path === 'home') ? 'home' : (/^r\//.test(path) ? 'restaurant' : 'inner');
  const query = new URLSearchParams(raw.split('?')[1] || '');
  document.querySelectorAll('.tabbar a').forEach((a) => a.removeAttribute('aria-current'));

  for (const [re, fn, needsAuth, tab] of ROUTES) {
    const m = path.match(re);
    if (!m) continue;
    if (needsAuth && !session) { goLogin(); return; }
    if (tab) document.querySelector(`.tabbar a[data-tab="${tab}"]`)?.setAttribute('aria-current', 'page');
    if (fn === viewRestaurants) fn(query);
    else if (fn === viewRestaurant || fn === viewGroup) fn([m[0], decodeURIComponent(m[1])]);
    else fn();
    return;
  }
  location.hash = '#/home';
}

// والضغط عليه بيفتح شاشة القسم بكل مطاعمه، مش مطعم واحد
function mktStripHtml(layout, blocks, byId) {
  const blockById = new Map(blocks.map((b) => [b.id, b]));
  const cards = layout.filter((it) => it.item_type === 'restaurant_block').map((it) => {
    const bl = blockById.get(it.block_id);
    if (!bl || !bl.members.some((m) => byId.has(m.restaurant_id))) return '';
    const first = bl.members.map((m) => byId.get(m.restaurant_id)).find(Boolean);
    const img = safeUrl(first?.cover_image_url) || safeUrl(first?.logo_url);
    const letter = esc((bl.title || '?').trim()[0] || '؟');
    return `<a class="mkt-card" href="#/g/${esc(bl.id)}" aria-label="${esc(bl.title)}">
      ${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : `<span class="mkt-card-fb" aria-hidden="true">${letter}</span>`}
      <span class="mkt-card-t"><strong class="mkt-card-n">${esc(bl.title)}</strong>${bl.subtitle ? `<span class="mkt-card-o">${esc(bl.subtitle)}</span>` : ''}</span>
    </a>`;
  }).join('');
  return cards ? `<section class="mkt-strip" aria-label="أقسام المطاعم">${cards}</section>` : '';
}

/* ============ قائمة المطاعم والتصنيفات ============ */
// المطاعم تُربط بالتصنيف عبر restaurants.category_id ← restaurant_categories.id (الـ join في loadRestaurants)
// الإعلانات: «الكل» ← restaurants_top / restaurants_between_*
//            تصنيف محدد ← category_top / category_between_*
// توزيع اللافتات داخل القائمة بالتساوي حسب ترتيب التخطيط (display_order)، ومن غير أرقام ثابتة
// توزيع المطاعم بين البلوكات واللافتات حسب ترتيب التخطيط: عنصر ثم مجموعة مطاعم،
// من غير ما يتجمع بلوكين أو لافتتين جنب بعض. القائمة بتعرض كل المطاعم المطابقة (زي تصنيف الكل).
function sequenceHtml(items, list, blocksById, ads, used) {
  const byId = new Map(list.map((r) => [r.id, r]));
  const parts = [];
  for (const it of items) {
    if (it.item_type === 'restaurant_block') {
      const bl = blocksById.get(it.block_id);
      if (!bl) continue;
      const html = blockHtml(bl, byId);
      if (!html) continue;
      parts.push(html);
    } else if (it.item_type === 'ad_banner') {
      const code = it.ad_placements?.code;
      const html = code ? adsHtml(pickAds(ads, code, used)) : '';
      if (html) parts.push(html);
    }
  }
  const rest = list;
  const n = parts.length;
  const cut = (i) => Math.floor((i * rest.length) / (n + 1));
  const rows = (from, to) => rest.slice(from, to).map((r) => restRowHtml(r)).join('');
  if (!n) return rows(0, rest.length);
  let out = '';
  for (let i = 0; i < n; i++) out += parts[i] + rows(cut(i), cut(i + 1));
  return out + rows(cut(n), rest.length);
}

// يرجّع الإعلانات المؤهلة للموضع، ويستبعد أي حملة ظهرت قبل كده في نفس الصفحة
function pickAds(ads, code, used) {
  return (ads.get(code) || []).filter((a) => {
    const key = a.campaign_id || a;
    if (used.has(key)) return false;
    used.add(key);
    return true;
  });
}

async function viewRestaurants(query) {
  const my = ++rid;
  viewSeq++;
  app.innerHTML = `${topbar('المطاعم')}
    <div id="top-ads"></div>
    <input class="search" id="s" type="search" placeholder="ابحث باسم المطعم" aria-label="ابحث عن مطعم">
    <nav class="chips" id="cats" aria-label="تصفية حسب التصنيف"></nav>
    <div id="list"><p class="meta">جاري التحميل…</p></div>`;

  const [rests, cats, blocks, restLayout, ads] = await Promise.all([
    loadRestaurants(), loadCategories(), loadBlocks(), loadLayout('restaurants'), loadAds(),
  ]);
  if (my !== rid) return;

  // التصنيف من الرابط لازم يكون نشط وموجود؛ غير كده نرجع لـ«الكل»
  const catBySlug = new Map(cats.map((c) => [c.slug, c]));
  let active = catBySlug.has(query.get('c') || '') ? query.get('c') : '';
  if ((query.get('c') || '') !== active) {
    history.replaceState(null, '', '#/restaurants');
  }

  // «الكل»: بلوكات المطاعم ولافتات restaurants_* فقط من تخطيط المطاعم
  const restPage = restLayout.filter((it) =>
    it.item_type === 'restaurant_block' ||
    (it.item_type === 'ad_banner' && /^restaurants_/.test(it.ad_placements?.code || '')));

  // تصنيف محدد: تخطيطه يُحمَّل بمعرف التصنيف الحقيقي، ولا يرث بلوكات الرئيسية أو المطاعم
  // كل تصنيف ليه تخطيطه المخزن بمعرفه؛ الطلب المتزامن لنفس التصنيف ما بيتكررش
  const catLayouts = new Map();     // category id -> عناصر التخطيط
  const catLayoutLoads = new Map(); // category id -> طلب جاري
  const ensureCatLayout = async () => {
    const cat = active ? catBySlug.get(active) : null;
    if (!cat || catLayouts.has(cat.id)) return;
    if (!catLayoutLoads.has(cat.id)) {
      catLayoutLoads.set(cat.id, loadLayout('category', cat.id).then((lay) => {
        catLayouts.set(cat.id, lay.filter((it) =>
          it.item_type === 'restaurant_block' ||
          (it.item_type === 'ad_banner' && /^category_/.test(it.ad_placements?.code || ''))));
      }).finally(() => catLayoutLoads.delete(cat.id)));
    }
    await catLayoutLoads.get(cat.id);
  };
  await ensureCatLayout();
  if (my !== rid) return;

  const matches = (r, term) =>
    (!active || r.restaurant_categories?.slug === active) &&
    (!term || (r.name || '').toLowerCase().includes(term));

  const drawChips = () => {
    $('#cats').innerHTML = `<button class="chip" data-c="" aria-pressed="${active === ''}">الكل</button>` +
      cats.map((c) => `<button class="chip" data-c="${esc(c.slug)}" aria-pressed="${active === c.slug}">${esc(c.name)}</button>`).join('');
  };

  const render = () => {
    if (!$('#list')) return; // الصفحة اتغيرت
    const term = $('#s').value.trim().toLowerCase();
    const list = rests.filter((r) => matches(r, term));
    const used = new Set(); // كل حملة تظهر مرة واحدة في الصفحة
    let items;

    if (active) {
      const cat = catBySlug.get(active);
      // لو التخطيط مش محمّل للتصنيف ده بالظبط ما نعرضش أي لافتة (ولا لافتات تصنيف تاني)
      const lay = cat && catLayouts.has(cat.id) ? catLayouts.get(cat.id) : [];
      const hasTop = lay.some((it) => it.ad_placements?.code === 'category_top');
      $('#top-ads').innerHTML = hasTop ? adsHtml(pickAds(ads, 'category_top', used)) : '';
      items = lay.filter((it) => it.ad_placements?.code !== 'category_top');
    } else {
      $('#top-ads').innerHTML = adsHtml(pickAds(ads, 'restaurants_top', used));
      items = restPage.filter((it) => it.ad_placements?.code !== 'restaurants_top');
    }

    const blocksById = new Map(blocks.map((b) => [b.id, b]));
    const emptyTxt = term ? 'مفيش مطعم يطابق بحثك'
      : active ? 'مفيش مطاعم في التصنيف ده دلوقتي'
      : 'مفيش مطاعم متاحة دلوقتي';
    $('#list').innerHTML = list.length ? sequenceHtml(items, list, blocksById, ads, used) : emptyHtml(emptyTxt);
    observeAds($('#top-ads'));
    observeAds($('#list'));
  };

  drawChips();
  render();
  observeAds(app);
  $('#s').addEventListener('input', render);
  $('#cats').addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-c]');
    if (!b) return;
    active = b.dataset.c;
    // نحدّث الرابط بدون إعادة تحميل، فالتصنيف يفضل محفوظ عند الريفرش أو عند فتح الرابط
    history.replaceState(null, '', active ? `#/restaurants?c=${encodeURIComponent(active)}` : '#/restaurants');
    drawChips();
    await ensureCatLayout();
    if (my !== rid) return;
    render();
  });
}

async function getCart(restaurantId, create) {
  const uid = session.user.id;
  let { data: cart } = await sb.from('carts').select('id, coupon_code')
    .eq('customer_id', uid).eq('restaurant_id', restaurantId).eq('status', 'active').maybeSingle();
  if (!cart && create) {
    const ins = await sb.from('carts').insert({ customer_id: uid, restaurant_id: restaurantId }).select('id, coupon_code').single();
    if (ins.error) throw ins.error;
    cart = ins.data;
  }
  if (!cart) return null;
  const { data: items } = await sb.from('cart_items').select('id, product_id, quantity').eq('cart_id', cart.id);
  return { id: cart.id, coupon_code: cart.coupon_code, items: items || [] };
}

function drawMenu() {
  const el = $('#menu');

  const known = new Set(R.menuCats.map((c) => c.id));

    .map((c) => ({ id: c.id, name: c.name, items: R.products.filter((p) => p.category_id === c.id) }))
    .filter((g) => g.items.length);
  const loose = R.products.filter((p) => !p.category_id || !known.has(p.category_id));
  if (loose.length) groups.push({ id: 'other', name: 'أطباق أخرى', items: loose });

  el.innerHTML = groups.length
    ? groups.map((g) => `<section id="sec-${esc(g.id)}"><h2 class="sec">${esc(g.name)}</h2>${g.items.map(productHtml).join('')}</section>`).join('')

async function setQty(productId, delta) {
  if (!session) return goLogin();
  try {
    const cart = await getCart(R.rest.id, true);
    const existing = cart.items.find((i) => i.product_id === productId);
    const next = (existing?.quantity || 0) + delta;
    if (existing && next <= 0) await sb.from('cart_items').delete().eq('id', existing.id);
    else if (existing) await sb.from('cart_items').update({ quantity: Math.min(next, 99) }).eq('id', existing.id);
    else if (next > 0) await sb.from('cart_items').insert({ cart_id: cart.id, product_id: productId, quantity: 1 });
    R.cart = await getCart(R.rest.id, false);
    drawMenu();
    refreshCartSummary().then(updateCartBtns);
  } catch (e) {
    toast(e.message || 'تعذّر تحديث السلة');
  }
}

      </fieldset>
      <p class="err" id="coErr" role="alert"></p>
      <button class="btn primary" id="placeBtn" type="submit" ${hasAny ? '' : 'disabled'}>أكد الطلب</button>
    </form>
  `, (sheetEl) => {
    const form = sheetEl.querySelector('#coForm');
    const err = sheetEl.querySelector('#coErr');
    const btn = sheetEl.querySelector('#placeBtn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      const name = sheetEl.querySelector('#cn').value.trim();
      const phone = sheetEl.querySelector('#cp').value.replace(/[\s-]/g, '');
      const addr = sheetEl.querySelector('#ca').value.trim();
      const coupon = sheetEl.querySelector('#cc').value.trim();
      const method = sheetEl.querySelector('input[name="pm"]:checked')?.value;

      if (!name) { err.textContent = 'اكتب اسمك'; return; }
      if (!PHONE_RE.test(phone)) { err.textContent = 'اكتب رقم موبايل مصري صحيح'; return; }
      if (addr.length < 5) { err.textContent = 'اكتب عنوان التوصيل بالتفصيل'; return; }
      if (!method) { err.textContent = 'اختار طريقة الدفع'; return; }

      btn.disabled = true;
      btn.textContent = 'بنأكد طلبك…';
      try {
        await sb.from('carts').update({ coupon_code: coupon || null }).eq('id', R.cart.id);
        const { data: orderId, error } = await sb.rpc('place_order', {
          p_cart_id: R.cart.id,
          p_shipping_address: addr,
          p_customer_phone: phone,
          p_customer_name: name,
          p_payment_method: method,
        });
        if (error) throw error;

        if (method === 'paymob') {
          const { data, error: fnErr } = await sb.functions.invoke('paymob-initiate', { body: { order_id: orderId } });
          if (fnErr || !data?.iframe_url) throw new Error(await invokeError(fnErr, 'تعذّر بدء الدفع'));
          location.href = data.iframe_url;
          return;
        }
        closeSheet();
        R.cart = null;
        refreshCartSummary().then(updateCartBtns);
        toast('استلمنا طلبك ✓');
        location.hash = '#/orders';
      } catch (ex) {
        err.textContent = ex.message || 'حصلت مشكلة، حاول تاني';
        btn.disabled = false;
        btn.textContent = 'أكد الطلب';
      }
    });
  });
}

/* ============ طلباتي ============ */
function orderHtml(o) {
  const p = (o.payments || [])[0];
  const items = (o.order_items || []).map((i) => `${i.quantity}× ${esc(i.product_name_snapshot)}`).join('، ');
  let payText = '';
  let payBtn = '';
  if (p) {
    if (p.status === 'paid') payText = 'مدفوع';
    else if (p.provider === 'cash') payText = 'الدفع عند الاستلام';
    else if (p.status === 'pending' && o.status === 'pending') {
      payText = 'لسه مادفعتش';
      payBtn = `<button class="btn primary auto" data-act="pay" data-order="${esc(o.id)}">ادفع الآن</button>`;
    }
  }
  return `<article class="order">
    <div class="between"><strong>${esc(o.restaurants?.name || 'مطعم')}</strong><b>${money(o.total_amount)}</b></div>
    <p class="meta">${items}</p>
    <p class="meta" style="margin-top:4px">${new Date(o.created_at).toLocaleString('ar-EG', { dateStyle: 'medium', timeStyle: 'short' })}</p>
    <span class="pill">${esc(STATUS[o.status] || o.status)}</span>
    ${payText ? `<p class="meta" style="margin-top:6px">${esc(payText)}</p>` : ''}
    ${payBtn}
  </article>`;
}

async function viewOrders() {
  const my = ++rid;
  app.innerHTML = topbar('طلباتي') + '<p class="meta">جاري التحميل…</p>';
  const { data: orders, error } = await sb.from('orders')
    .select('id, status, total_amount, created_at, restaurants(name), payments(id, provider, status), order_items(product_name_snapshot, quantity)')
    .order('created_at', { ascending: false }).limit(30);
  if (my !== rid) return;
  if (error) { app.innerHTML = topbar('طلباتي') + emptyHtml('تعذّر تحميل طلباتك'); return; }

  app.innerHTML = topbar('طلباتي') + (orders.length
    ? orders.map(orderHtml).join('')
    : emptyHtml('لسه ماطلبتش حاجة. ابدأ من المطاعم.'));

  const waiting = orders.some((o) => o.status === 'pending' && (o.payments || []).some((p) => p.provider === 'paymob' && p.status === 'pending'));
  if (waiting) {
    pollTimer = setInterval(() => { if (location.hash === '#/orders') viewOrders(); }, 8000);
  }
}

async function payOrder(orderId, btn) {
  btn.disabled = true;
  const old = btn.textContent;
  btn.textContent = 'جاري التحويل…';
  const { data, error } = await sb.functions.invoke('paymob-initiate', { body: { order_id: orderId } });
  if (error || !data?.iframe_url) {
    toast(await invokeError(error, 'تعذّر بدء الدفع'));
    btn.disabled = false;
    btn.textContent = old;
    return;
  }
  location.href = data.iframe_url;
}

/* ============ حسابي ============ */
async function viewAccount() {
  const my = ++rid;
  await loadProfile();
  const { data: pts } = await sb.from('customer_points_ledger').select('points');
  const total = (pts || []).reduce((s, x) => s + Number(x.points || 0), 0);
  if (my !== rid) return;

  app.innerHTML = topbar('حسابي') + `
    <div class="acct">
      <p class="meta">${esc(session.user.email)}</p>
      <div class="points">نقاطك: <b>${total}</b></div>
      <form id="pf" novalidate>
        <label for="pn">الاسم</label>
        <input id="pn" required value="${esc(profile?.full_name || '')}" autocomplete="name">
        <label for="pp">رقم الموبايل</label>
        <input id="pp" inputmode="tel" required value="${esc(profile?.phone || '')}" autocomplete="tel">
        <p class="err" id="pErr" role="alert"></p>
        <button class="btn primary" type="submit">احفظ البيانات</button>
      </form>
      <button class="btn ghost" data-act="logout">اخرج من الحساب</button>
    </div>`;

  $('#pf').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = $('#pn').value.trim();
    const phone = $('#pp').value.replace(/[\s-]/g, '');
    if (!name) { $('#pErr').textContent = 'اكتب اسمك'; return; }
    if (phone && !PHONE_RE.test(phone)) { $('#pErr').textContent = 'اكتب رقم موبايل مصري صحيح'; return; }
    const { error } = await sb.from('profiles').update({ full_name: name, phone: phone || null }).eq('id', session.user.id);
    if (error) { $('#pErr').textContent = error.message; return; }
    await loadProfile();
    toast('اتحفظت بياناتك');
  });
}

/* ============ دخول / تسجيل ============ */
function viewLogin() {
  ++rid;
  let mode = 'login';
  const draw = () => {
    const isLogin = mode === 'login';
    app.innerHTML = topbar(isLogin ? 'ادخل حسابك' : 'أنشئ حساب') + `
      <form id="af" class="auth" novalidate>
        ${isLogin ? '' : `
          <label for="an">الاسم</label>
          <input id="an" required autocomplete="name">
          <label for="ap">رقم الموبايل</label>
          <input id="ap" inputmode="tel" required autocomplete="tel">`}
        <label for="ae">الإيميل</label>
        <input id="ae" type="email" required autocomplete="email">
        <label for="apw">كلمة السر</label>
        <input id="apw" type="password" minlength="6" required autocomplete="${isLogin ? 'current-password' : 'new-password'}">
        <p class="err" id="aErr" role="alert"></p>
        <button class="btn primary" id="aBtn" type="submit" style="margin-top:14px">${isLogin ? 'دخول' : 'إنشاء الحساب'}</button>
      </form>
      <button class="linkbtn" type="button" id="swap">${isLogin ? 'معييش حساب؟ أنشئ واحد' : 'عندي حساب بالفعل'}</button>`;

    $('#swap').onclick = () => { mode = isLogin ? 'register' : 'login'; draw(); };
    $('#af').onsubmit = async (e) => {
      e.preventDefault();
      const err = $('#aErr');
      const btn = $('#aBtn');
      err.textContent = '';
      const email = $('#ae').value.trim();
      const password = $('#apw').value;
      btn.disabled = true;
      try {
        if (isLogin) {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
          location.hash = '#/home';
        } else {
          const name = $('#an').value.trim();
          const phone = $('#ap').value.replace(/[\s-]/g, '');
          if (!name) throw new Error('اكتب اسمك');
          if (!PHONE_RE.test(phone)) throw new Error('اكتب رقم موبايل مصري صحيح');
          const { data, error } = await sb.auth.signUp({ email, password, options: { data: { full_name: name, phone } } });
          if (error) throw error;
          if (!data.session) {
            err.textContent = 'بعتنالك رسالة تأكيد على الإيميل. أكّده وبعدين ادخل.';
            btn.disabled = false;
            return;
          }
          location.hash = '#/home';
        }
      } catch (ex) {
        err.textContent = isLogin && ex.message && !/Invalid login/i.test(ex.message) ? ex.message : translateAuthError(ex.message);
        btn.disabled = false;
      }
    };
  };
  draw();
}

/* ============ الأحداث العامة (delegation) ============ */
app.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'inc') return setQty(b.dataset.id, 1);
  if (act === 'dec') return setQty(b.dataset.id, -1);
  if (act === 'pay') return payOrder(b.dataset.order, b);
  if (act === 'logout') return logout();
  if (act === 'cart') return openCartSheet();
  if (act === 'scroll') return document.getElementById(b.dataset.target)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

/* ============ الإقلاع ============ */
function registerSW() {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));
  }
}

(async function boot() {
  registerSW();
  const { data } = await sb.auth.getSession();
  session = data.session;
  await loadProfile();

  sb.auth.onAuthStateChange((event, s) => {
    // نأجل الاستدعاءات لبرّه الـ callback عشان نتفادى تعارض داخلي في المكتبة
    setTimeout(async () => {
      session = s;
      await loadProfile();
      if (event === 'SIGNED_IN' || event === 'SIGNED_OUT') route();
    }, 0);
  });

  if (!location.hash) location.hash = '#/home';
  else route();
})();
</script>
