<style>

}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}

:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}

.empty{text-align:center;padding:48px 16px;color:var(--ink-2)}

.topbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 10px;min-height:60px}

.restaurant-card__link{display:block;text-decoration:none;color:inherit;flex:1;min-width:0}

.rhead{font-size:26px;margin:14px 0 4px}

.tabbar a:active{transform:scale(.98)}

.sum{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.sum.total{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700;font-size:17px}
.opt{display:flex;gap:10px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:8px 0;font-size:15px;color:var(--ink);cursor:pointer}
.opt input{width:auto;accent-color:var(--ink)}
.opt small{display:block;color:var(--ink-2)}
fieldset{border:0;margin:14px 0 0;padding:0}
legend{font-size:13px;color:var(--ink-2);padding:0;margin-bottom:4px}
.inline{display:flex;gap:8px}
.inline input{flex:1}
.order{background:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px}
.between{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pill{display:inline-block;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--bg);margin-top:8px}
.order .btn{margin-top:10px}
.auth{background:#fff;border-radius:18px;padding:18px;margin-top:8px}
.points{background:#fff;border-radius:var(--r);padding:16px;margin:10px 0 4px;font-size:16px}
.points b{font-family:"Reem Kufi",sans-serif;font-size:26px;color:var(--olive)}
.acct form{background:#fff;border-radius:18px;padding:16px;margin-top:10px}
.acct .btn{margin-top:16px}
.toast{position:fixed;top:12px;inset-inline:12px;max-width:496px;margin:0 auto;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;z-index:40;font-size:14px}
@media (min-width: 768px){
  .wrap{padding-inline:20px}
  .restaurant-block__grid{padding-bottom:10px}
  .restaurant-block__col{flex-basis:min(32vw, 380px);max-width:min(32vw, 380px)}
}
@media (max-width: 767px){
  .restaurant-card{min-height:130px}
  .restaurant-card__media{width:112px;min-width:112px}
  .restaurant-block__col{flex-basis:min(82vw, 420px);max-width:82vw}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

<script>
const SB_URL = 'https://hazyajkncrdfewkvnoww.supabase.co';
const SB_KEY = 'sb_publishable_9Kf6dTQTqI9h7-yGALWMWg_bjPzM6Zu';
const sb = window.supabase.createClient(SB_URL, SB_KEY);
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => `${Number(n || 0).toLocaleString('ar-EG', { maximumFractionDigits: 2 })} ج.م`;
const stars = (n) => { const v = Math.round(Number(n || 0)); return '★'.repeat(v) + '☆'.repeat(5 - v); };
const app = $('#app');
const cartbar = $('#cartbar');
const STATUS = { pending: 'مستنين تأكيد المطعم', confirmed: 'اتأكد وبيتجهز', preparing: 'بيتحضر', delivering: 'في الطريق ليك', completed: 'اتسلم', cancelled: 'تم الإلغاء' };
const PHONE_RE = /^(\+?20)?01[0125][0-9]{8}$/;
const FAVORITE_KEY = 'sahab_favorites';
let session = null;
let profile = null;
let rid = 0;
let pollTimer = null;
let R = null;

function safeJsonParse(value, fallback = {}) {
  if (!value || typeof value !== 'string') return fallback;
  try { return JSON.parse(value); } catch { return fallback; }
}
function normalizeCardStyle(cardStyle) {
  const parsed = typeof cardStyle === 'string' ? safeJsonParse(cardStyle, {}) : (cardStyle || {});
  return {
    card_layout: parsed.card_layout || 'horizontal',
    image_position: parsed.image_position || 'right',
    columns: Number(parsed.columns || 3),
    items_per_column: Number(parsed.items_per_column || 3),
    scroll_direction: parsed.scroll_direction || 'horizontal',
    auto_scroll: parsed.auto_scroll === true
  };
}
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
function openSheet(html, onMount) { closeSheet(); const bd = document.createElement('div'); bd.className = 'backdrop'; bd.id = 'sheet'; bd.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; document.body.appendChild(bd); onMount?.(bd.querySelector('.sheet')); }
function closeSheet() { $('#sheet')?.remove(); }
async function invokeError(error, fallback) { if (!error) return fallback; try { const j = await error.context.json(); return j.error || fallback; } catch { return fallback; } }
function translateAuthError(msg = '') {
  if (/Invalid login/i.test(msg)) return 'الإيميل أو كلمة السر غلط';
  if (/already registered/i.test(msg)) return 'الإيميل ده مسجل قبل كده، ادخل من الأول';
  if (/least 6/i.test(msg)) return 'كلمة السر لازم تكون 6 حروف على الأقل';
  if (/valid email/i.test(msg)) return 'اكتب إيميل صحيح';
  return msg || 'حصلت مشكلة، حاول تاني';
}
function readDeep(data, paths) {
  for (const path of paths) {
    const keys = path.split('.');
    let current = data;
    let found = true;
    for (const key of keys) {
      const next = current && typeof current === 'object' ? current[key] : undefined;
      if (next === undefined || next === null) { found = false; break; }
      current = next;
    }
    if (found && current !== undefined && current !== null && current !== '') return current;
  }
  return undefined;
}

async function loadProfile() {
  if (!session) { profile = null; return; }
  try {
    const { data } = await sb.from('profiles').select('id, full_name, phone, role').eq('id', session.user.id).maybeSingle();
    profile = data || null;
  } catch (err) {
    console.error('loadProfile error', err); profile = null;
  }
}
function goLogin() { toast('سجّل دخولك الأول'); location.hash = '#/login'; }
async function logout() { try { await sb.auth.signOut(); } catch {} location.hash = '#/home'; toast('خرجت من حسابك'); }

async function loadRestaurants() {
  try {
    const { data, error } = await sb.from('restaurants')
      .select('id, name, slug, description, logo_url, cover_image_url, address, rating, delivery_fee, delivery_min_minutes, is_open, category_id, is_published, restaurant_categories(name, slug), restaurant_badge_assignments(is_active, badges(name, display_text, background_color, text_color))')
      .eq('is_published', true)
      .order('rating', { ascending: false });
    if (error) throw error;
    return Array.isArray(data) ? data : [];
  } catch (err) {
    console.error('loadRestaurants error', err);
    return [];
  }
}
async function loadCategories() {
  try {
    const { data, error } = await sb.from('restaurant_categories').select('id, name, slug').eq('is_active', true).order('display_order');
    if (error) throw error;
    return Array.isArray(data) ? data : [];
  } catch (err) {
    console.error('loadCategories error', err);
    return [];
  }
}
async function loadHomepageLayout(pageKey = 'home', categoryId = null) {
  try {
    const { data, error } = await sb.rpc('get_public_homepage_layout', { p_page_key: pageKey, p_category_id: categoryId });
    if (error) throw error;
    return Array.isArray(data) ? data : [];
  } catch (err) {
    console.error('get_public_homepage_layout error', err);
    return [];
  }
}
async function loadAdInventory() {
  try {
    const { data, error } = await sb.rpc('get_public_ad_inventory');
    if (error) throw error;
    return Array.isArray(data) ? data : [];
  } catch (err) {
    console.error('get_public_ad_inventory error', err);
    return [];
  }
}
function normalizeCampaigns(value) {
  if (!value) return [];
  if (Array.isArray(value)) return value.filter(Boolean);
  if (Array.isArray(value.campaigns)) return value.campaigns.filter(Boolean);
  if (Array.isArray(value.items)) return value.items.filter(Boolean);
  if (Array.isArray(value.data)) return value.data.filter(Boolean);
  if (value.campaign && Array.isArray(value.campaign)) return value.campaign.filter(Boolean);
  return [];
}
function getAdPlacementMap(adInventory) {
  const map = new Map();
  (adInventory || []).forEach((entry) => {
    const placementCode = readDeep(entry, ['placement_code', 'placement', 'code', 'placement_key', 'location_code']) || readDeep(entry, ['id']);
    if (!placementCode) return;
    map.set(String(placementCode), entry);
  });
  return map;
}
function getEligibleCampaign(adEntry) {
  if (!adEntry) return null;
  const campaigns = normalizeCampaigns(adEntry);

function normalizeHomeLayoutRow(row) {

}

function renderRestaurantBlock(block, restaurantsById, categoryMap) {
  const style = normalizeCardStyle(block.card_style);
  const entries = Array.isArray(block?.overrides) ? block.overrides : [];
  const seen = new Set();
  const restaurants = [];
  for (const entry of entries) {
    if (!entry || !entry.restaurant_id) continue;
    const restaurant = restaurantsById.get(String(entry.restaurant_id)) || restaurantsById.get(Number(entry.restaurant_id));
    if (!restaurant || seen.has(String(restaurant.id))) continue;
    seen.add(String(restaurant.id));
    restaurants.push(restaurant);
  }
  if (!restaurants.length) return '';
  const cardsPerColumn = Math.max(1, Number(style.items_per_column || 3));
  const columns = [];
  for (let i = 0; i < restaurants.length; i += cardsPerColumn) {
    columns.push(restaurants.slice(i, i + cardsPerColumn));
  }
  const grid = columns.map((column) => `<div class="restaurant-block__col">${column.map((restaurant) => restRowHtml(restaurant)).join('')}</div>`).join('');
  const subtitle = block.subtitle ? `<p class="meta sub">${esc(block.subtitle)}</p>` : '';
  return `<section class="restaurant-block">
    <h2 class="sec restaurant-block__header">${esc(block.title || 'مطاعم')}</h2>
    ${subtitle}
    <div class="restaurant-block__grid">${grid}</div>
  </section>`;
}

function renderHomepageLayout(layoutRows, restaurantsById, blockMap, adMap) {
  if (!Array.isArray(layoutRows) || !layoutRows.length) return '';
  const sorted = layoutRows
    .map(normalizeHomeLayoutRow)
    .filter(Boolean)
    .sort((a, b) => Number(a.display_order || 0) - Number(b.display_order || 0));

  const markup = sorted.map((entry) => {
    if (entry.type === 'restaurant_block' || entry.type === 'block') {
      const blockId = entry.restaurant_block_id || entry.id;
      const block = blockMap.get(String(blockId));
      if (!block) return '';
      return renderRestaurantBlock(block, restaurantsById, null);
    }
    if (entry.type === 'ad_banner' || entry.type === 'banner' || entry.type === 'ad') {
      const placementCode = entry.placement_code || entry.id || null;
      if (!placementCode) return '';
      const ad = adMap.get(String(placementCode));
      return renderBanner(ad);
    }
    return '';
  }).join('');
  return markup;
}

async function getCart(restaurantId, create) {
  if (!session) return null;
  const uid = session.user.id;
  let { data: cart } = await sb.from('carts').select('id, coupon_code').eq('customer_id', uid).eq('restaurant_id', restaurantId).eq('status', 'active').maybeSingle();
  if (!cart && create) {
    const ins = await sb.from('carts').insert({ customer_id: uid, restaurant_id: restaurantId }).select('id, coupon_code').single();
    if (ins.error) throw ins.error;
    cart = ins.data;
  }
  if (!cart) return null;
  const { data: items } = await sb.from('cart_items').select('id, product_id, quantity').eq('cart_id', cart.id);
  return { id: cart.id, coupon_code: cart.coupon_code, items: items || [] };
}
const GUEST_CART_KEY = 'sahab_guest_cart';
const PENDING_CHECKOUT_KEY = 'sahab_pending_checkout';
function guestCartLoad(restaurantId) { try { const all = JSON.parse(sessionStorage.getItem(GUEST_CART_KEY) || '{}'); return all[restaurantId] || []; } catch { return []; } }
function guestCartSave(restaurantId, items) { try { const all = JSON.parse(sessionStorage.getItem(GUEST_CART_KEY) || '{}'); if (items.length) all[restaurantId] = items; else delete all[restaurantId]; sessionStorage.setItem(GUEST_CART_KEY, JSON.stringify(all)); } catch {} }
function loadCartForRestaurant(restaurantId) { if (session) return getCart(restaurantId, false); const items = guestCartLoad(restaurantId); return Promise.resolve(items.length ? { id: null, coupon_code: null, items } : { id: null, coupon_code: null, items: [] }); }
async function syncGuestCart() {
  let all; try { all = JSON.parse(sessionStorage.getItem(GUEST_CART_KEY) || '{}'); } catch { all = {}; }
  const rids = Object.keys(all).filter((rid) => all[rid]?.length);
  for (const rid of rids) {
    const cart = await getCart(Number(rid), true);
    if (!cart) continue;
    for (const item of all[rid]) {
      const existing = cart.items.find((i) => i.product_id === item.product_id);
      if (existing) {
        await sb.from('cart_items').update({ quantity: item.quantity }).eq('id', existing.id);
      } else {
        await sb.from('cart_items').insert({ cart_id: cart.id, product_id: item.product_id, quantity: item.quantity });
      }
    }
    delete all[rid];
  }
  sessionStorage.setItem(GUEST_CART_KEY, JSON.stringify(all));
}

  if (!r) { app.innerHTML = backbar('') + emptyHtml('المطعم ده مش متاح دلوقتي'); return; }
  const [menuCats, products, offers, reviews, methods, cart] = await Promise.all([
    sb.from('menu_categories').select('id, name, display_order').eq('restaurant_id', r.id).eq('is_active', true).order('display_order'),
    sb.from('products').select('id, name, description, price, emoji, category_id, display_order, product_images(image_url, display_order)').eq('restaurant_id', r.id).eq('is_available', true).order('display_order'),
    sb.from('restaurant_offers').select('id, title, description').eq('restaurant_id', r.id),
    sb.from('restaurant_reviews').select('rating, review_text, created_at').eq('restaurant_id', r.id).order('created_at', { ascending: false }).limit(5),
    loadMethods(r.id),
    loadCartForRestaurant(r.id),
  ]);
  if (my !== rid) return;
  R = { rest: r, menuCats: menuCats.data || [], products: products.data || [], prodMap: new Map((products.data || []).map((p) => [p.id, p])), offers: offers.data || [], reviews: reviews.data || [], methods, cart: cart || { id: null, coupon_code: null, items: [] } };
  const badges = badgesOf(r).map(badgeHtml).join(' ');
  const payNames = [methods.cash && 'كاش', methods.paymob && 'فيزا / محفظة'].filter(Boolean).join(' · ');
  app.innerHTML = `
    ${backbar(r.name)}
    <div class="hero">${r.cover_image_url ? `<img src="${esc(r.cover_image_url)}" alt="">` : `<span class="hero-fb" aria-hidden="true">${esc(r.name.trim()[0])}</span>`}</div>
    <h1 class="rhead">${esc(r.name)}</h1>
    <div class="facts">
      <span>${stars(r.rating)} ${Number(r.rating || 0).toFixed(1)}</span>
      <span>${esc(r.restaurant_categories?.name || '')}</span>
      <span>${deliveryText(r)}</span>
    </div>
    ${badges ? `<p style="margin-top:8px">${badges}</p>` : ''}
    ${r.description ? `<p style="margin-top:10px">${esc(r.description)}</p>` : ''}
    ${r.address ? `<p class="meta" style="margin-top:6px">${esc(r.address)}</p>` : ''}
    ${R.offers.length ? R.offers.map((o) => `<div class="offerbox"><strong>${esc(o.title)}</strong>${o.description ? `<p class="meta">${esc(o.description)}</p>` : ''}</div>`).join('') : ''}
    ${payNames ? `<p class="meta" style="margin-top:10px">طرق الدفع: ${esc(payNames)}</p>` : ''}
    <nav class="chips menucats" aria-label="أقسام المنيو" style="margin-top:14px">
      ${R.menuCats.map((c) => `<button class="chip" data-act="scroll" data-target="sec-${esc(c.id)}">${esc(c.name)}</button>`).join('')}
    </nav>
    <div id="menu"></div>
    ${R.reviews.length ? `<h2 class="sec">آراء العملاء</h2>${R.reviews.map((x) => `<div class="review"><span class="stars">${stars(x.rating)}</span>${x.review_text ? `<p>${esc(x.review_text)}</p>` : ''}</div>`).join('')}` : ''}
  `;
  drawMenu();
  if (!r.is_open) toast('المطعم مقفول دلوقتي');
}

function productHtml(p) {
  const inCart = R.cart?.items.find((i) => i.product_id === p.id);
  const qty = inCart?.quantity || 0;
  const img = [...(p.product_images || [])].sort((a, b) => a.display_order - b.display_order)[0]?.image_url;
  const control = qty ? `<span class="qty"><button data-act="dec" data-id="${esc(p.id)}" aria-label="قلل ${esc(p.name)}">−</button><span aria-live="polite">${qty}</span><button data-act="inc" data-id="${esc(p.id)}" aria-label="زيد ${esc(p.name)}">+</button></span>` : `<button class="addbtn" data-act="inc" data-id="${esc(p.id)}">أضف</button>`;
  return `<article class="product"><div class="thumb" aria-hidden="true">${img ? `<img src="${esc(img)}" alt="" loading="lazy" style="width:100%;height:100%;object-fit:cover;border-radius:12px">` : esc((p.name || '?').trim()[0] || '؟')}</div><div class="grow"><div class="between"><strong>${esc(p.name)}</strong><span class="price">${money(p.price)}</span></div>${p.description ? `<p class="meta">${esc(p.description)}</p>` : ''}<div class="pricerow">${control}</div></div></article>`;
}

function drawMenu() {
  const el = $('#menu');
  if (!el || !R) return;
  const known = new Set(R.menuCats.map((c) => c.id));
  const groups = R.menuCats.map((c) => ({ id: c.id, name: c.name, items: R.products.filter((p) => p.category_id === c.id) })).filter((g) => g.items.length);
  const loose = R.products.filter((p) => !p.category_id || !known.has(p.category_id));
  if (loose.length) groups.push({ id: 'other', name: 'أطباق أخرى', items: loose });
  el.innerHTML = groups.length ? groups.map((g) => `<section id="sec-${esc(g.id)}"><h2 class="sec">${esc(g.name)}</h2>${g.items.map(productHtml).join('')}</section>`).join('') : emptyHtml('المطعم ما عندوش أطباق متاحة دلوقتي');
  drawCartBar();
  document.querySelectorAll('[data-act="inc"]').forEach((b) => b.onclick = () => setQty(Number(b.dataset.id), 1));
  document.querySelectorAll('[data-act="dec"]').forEach((b) => b.onclick = () => setQty(Number(b.dataset.id), -1));
  document.querySelectorAll('[data-target]').forEach((b) => b.onclick = () => { const target = document.getElementById(b.dataset.target); if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
}

function cartLines() { if (!R?.cart) return []; return R.cart.items.filter((i) => R.prodMap.has(i.product_id)).map((i) => ({ ...i, product: R.prodMap.get(i.product_id) })); }
function drawCartBar() { const lines = cartLines(); const count = lines.reduce((s, i) => s + i.quantity, 0); if (!count || location.hash.indexOf('#/r/') !== 0) { cartbar.classList.add('hidden'); cartbar.innerHTML = ''; return; } const total = lines.reduce((s, i) => s + Number(i.product.price || 0) * i.quantity, 0); cartbar.innerHTML = `<span>${count} عنصر</span><strong>${money(total)}</strong><button class="btn primary auto" type="button" onclick="openCheckout()">تأكيد الطلب</button>`; cartbar.classList.remove('hidden'); }

async function setQty(productId, delta) {
  if (!session) {
    const items = guestCartLoad(R.rest.id);
    const existing = items.find((i) => i.product_id === productId);
    const next = (existing?.quantity || 0) + delta;
    if (existing && next <= 0) items.splice(items.indexOf(existing), 1);
    else if (existing) existing.quantity = Math.min(next, 99);
    else if (next > 0) items.push({ id: 'g_' + productId, product_id: productId, quantity: 1 });
    guestCartSave(R.rest.id, items);
    R.cart = items.length ? { id: null, coupon_code: null, items } : null;
    drawMenu();
    return;
  }
  try {
    const cart = await getCart(R.rest.id, true);
    const existing = cart.items.find((i) => i.product_id === productId);
    const next = (existing?.quantity || 0) + delta;
    if (existing && next <= 0) await sb.from('cart_items').delete().eq('id', existing.id);
    else if (existing) await sb.from('cart_items').update({ quantity: Math.min(next, 99) }).eq('id', existing.id);
    else if (next > 0) await sb.from('cart_items').insert({ cart_id: cart.id, product_id: productId, quantity: 1 });
    R.cart = await getCart(R.rest.id, false);
    drawMenu();
  } catch (e) { toast(e.message || 'تعذّر تحديث السلة'); }
}

function openCheckout() {
  if (!session) { sessionStorage.setItem(PENDING_CHECKOUT_KEY, R.rest.slug); return goLogin(); }
  const lines = cartLines();
  if (!lines.length) return;
  const sub = lines.reduce((s, i) => s + Number(i.product.price) * i.quantity, 0);
  const fee = Number(R.rest.delivery_fee || 0);
  const m = R.methods;
  const hasAny = m.cash || m.paymob;
  const firstMethod = m.cash ? 'cash' : 'paymob';
  openSheet(`
    <h2>تأكيد الطلب</h2>
    <p class="meta">من ${esc(R.rest.name)}</p>
    <div style="margin-top:12px">
      ${lines.map((i) => `<div class="sum"><span>${i.quantity} × ${esc(i.product.name)}</span><b>${money(i.product.price * i.quantity)}</b></div>`).join('')}
      <div class="sum"><span>التوصيل</span><b>${fee ? money(fee) : 'مجاني'}</b></div>
      <div class="sum total"><span>الإجمالي التقريبي</span><b>${money(sub + fee)}</b></div>
    </div>
    <form id="coForm" novalidate>
      <label for="cn">الاسم</label>
      <input id="cn" required value="${esc(profile?.full_name || '')}" autocomplete="name">
      <label for="cp">رقم الموبايل</label>
      <input id="cp" inputmode="tel" required value="${esc(profile?.phone || '')}" autocomplete="tel">
      <label for="ca">عنوان التوصيل بالتفصيل</label>
      <textarea id="ca" rows="2" required autocomplete="street-address"></textarea>
      <label for="cc">كود الخصم (اختياري)</label>
      <input id="cc" value="${esc(R.cart?.coupon_code || '')}" autocomplete="off">
      <fieldset>
        <legend>طريقة الدفع</legend>
        ${hasAny ? `
          ${m.cash ? `<label class="opt"><input type="radio" name="pm" value="cash" ${firstMethod === 'cash' ? 'checked' : ''}><span>الدفع عند الاستلام<small>ادفع كاش للمندوب</small></span></label>` : ''}
          ${m.paymob ? `<label class="opt"><input type="radio" name="pm" value="paymob" ${firstMethod === 'paymob' ? 'checked' : ''}><span>فيزا أو محفظة<small>دفع آمن عبر Paymob</small></span></label>` : ''}
        ` : '<p class="err">المطعم مش بيستقبل طلبات دلوقتي</p>'}
      </fieldset>
      <p class="err" id="coErr" role="alert"></p>
      <button class="btn primary" id="placeBtn" type="submit" ${hasAny ? '' : 'disabled'}>أكد الطلب</button>
    </form>
  `, (sheetEl) => {
    const form = sheetEl.querySelector('#coForm');
    const err = sheetEl.querySelector('#coErr');
    const btn = sheetEl.querySelector('#placeBtn');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      const name = sheetEl.querySelector('#cn').value.trim();
      const phone = sheetEl.querySelector('#cp').value.replace(/[\s-]/g, '');
      const addr = sheetEl.querySelector('#ca').value.trim();
      const coupon = sheetEl.querySelector('#cc').value.trim();
      const method = sheetEl.querySelector('input[name="pm"]:checked')?.value;
      if (!name) { err.textContent = 'اكتب اسمك'; return; }
      if (!PHONE_RE.test(phone)) { err.textContent = 'اكتب رقم موبايل مصري صحيح'; return; }
      if (addr.length < 5) { err.textContent = 'اكتب عنوان التوصيل بالتفصيل'; return; }
      if (!method) { err.textContent = 'اختار طريقة الدفع'; return; }
      btn.disabled = true; btn.textContent = 'بنأكد طلبك…';
      try {
        await sb.from('carts').update({ coupon_code: coupon || null }).eq('id', R.cart.id);
        const { data: orderId, error } = await sb.rpc('place_order', { p_cart_id: R.cart.id, p_shipping_address: addr, p_customer_phone: phone, p_customer_name: name, p_payment_method: method });
        if (error) throw error;
        if (method === 'paymob') {
          const { data, error: fnErr } = await sb.functions.invoke('paymob-initiate', { body: { order_id: orderId } });
          if (fnErr || !data?.iframe_url) throw new Error(await invokeError(fnErr, 'تعذّر بدء الدفع'));
          location.href = data.iframe_url;
          return;
        }
        closeSheet();
        R.cart = null;
        toast('استلمنا طلبك ✓');
        location.hash = '#/orders';
      } catch (ex) {
        err.textContent = ex.message || 'حصلت مشكلة، حاول تاني';
        btn.disabled = false;
        btn.textContent = 'أكد الطلب';
      }
    });
  });
}

function orderHtml(o) {
  const p = (o.payments || [])[0];
  const items = (o.order_items || []).map((i) => `${i.quantity}× ${esc(i.product_name_snapshot)}`).join('، ');
  let payText = '', payBtn = '';
  if (p) {
    if (p.status === 'paid') payText = 'مدفوع';
    else if (p.provider === 'cash') payText = 'الدفع عند الاستلام';
    else if (p.status === 'pending' && o.status === 'pending') { payText = 'لسه مادفعتش'; payBtn = `<button class="btn primary auto" data-act="pay" data-order="${esc(o.id)}">ادفع الآن</button>`; }
  }
  return `<article class="order"><div class="between"><strong>${esc(o.restaurants?.name || 'مطعم')}</strong><b>${money(o.total_amount)}</b></div><p class="meta">${items}</p><p class="meta" style="margin-top:8px">${esc(STATUS[o.status] || o.status || 'قيد التنفيذ')}</p>${payText ? `<span class="pill">${esc(payText)}</span>` : ''}${payBtn ? `<div class="between" style="margin-top:10px">${payBtn}</div>` : ''}</article>`;
}

async function viewOrders() {
  const my = ++rid;
  app.innerHTML = topbar('طلباتي') + '<p class="meta">جاري التحميل…</p>';
  try {
    const { data: orders, error } = await sb.from('orders').select('id, status, total_amount, created_at, restaurants(name), payments(id, provider, status), order_items(product_name_snapshot, quantity)').order('created_at', { ascending: false });
    if (my !== rid) return;
    if (error) throw error;
    app.innerHTML = topbar('طلباتي') + (orders.length ? orders.map(orderHtml).join('') : emptyHtml('لسه ماطلبتش حاجة. ابدأ من المطاعم.'));
    document.querySelectorAll('[data-act="pay"]').forEach((btn) => { btn.onclick = () => payOrder(btn.dataset.order, btn); });
    const waiting = orders.some((o) => o.status === 'pending' && (o.payments || []).some((p) => p.provider === 'paymob' && p.status === 'pending'));
    if (waiting) pollTimer = setInterval(() => { if (location.hash === '#/orders') viewOrders(); }, 8000);
  } catch (err) {
    console.error('viewOrders error', err);
    if (my !== rid) return;
    app.innerHTML = topbar('طلباتي') + emptyHtml('تعذّر تحميل طلباتك');
  }
}
async function payOrder(orderId, btn) {
  btn.disabled = true;
  const old = btn.textContent;
  btn.textContent = 'جاري التحويل…';
  const { data, error } = await sb.functions.invoke('paymob-initiate', { body: { order_id: orderId } });
  if (error || !data?.iframe_url) { toast(await invokeError(error, 'تعذّر بدء الدفع')); btn.disabled = false; btn.textContent = old; return; }
  location.href = data.iframe_url;
}

function viewLogin() {
  app.innerHTML = `${topbar('تسجيل الدخول')}<div class="auth"><form id="loginForm"><label>الإيميل</label><input type="email" id="email" required><label>كلمة السر</label><input type="password" id="pass" required><p class="err" id="loginErr" role="alert"></p><button class="btn primary" type="submit">دخول</button></form></div>`;
  $('#loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('#email').value.trim();
    const pass = $('#pass').value;
    $('#loginErr').textContent = '';
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
      if (error) throw error;
      session = data;
      await loadProfile();
      location.hash = sessionStorage.getItem(PENDING_CHECKOUT_KEY) ? '#/r/' + sessionStorage.getItem(PENDING_CHECKOUT_KEY) : '#/home';
      sessionStorage.removeItem(PENDING_CHECKOUT_KEY);
      toast('تم تسجيل الدخول');
    } catch (err) {
      $('#loginErr').textContent = translateAuthError(err.message || 'تعذّر تسجيل الدخول');
    }
  });
}

async function viewAccount() {
  const my = ++rid;
  await loadProfile();
  if (my !== rid) return;
  app.innerHTML = `${topbar('حسابي')}<div class="points"><b>${esc(profile?.full_name || 'ضيف')}</b><div class="meta">${esc(profile?.phone || 'لا يوجد رقم')}</div></div><div class="acct"><form id="profileForm"><label>الاسم</label><input id="fullName" value="${esc(profile?.full_name || '')}"><label>رقم الهاتف</label><input id="phone" value="${esc(profile?.phone || '')}"><button class="btn primary" type="submit">حفظ</button></form><button class="btn ghost" id="logoutBtn" type="button">تسجيل الخروج</button></div>`;
  $('#profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await sb.from('profiles').update({ full_name: $('#fullName').value.trim(), phone: $('#phone').value.trim() }).eq('id', session.user.id);
      toast('تم حفظ بياناتك');
    } catch (err) { console.error('update profile error', err); toast('تعذّر حفظ بياناتك'); }
  });
  $('#logoutBtn').onclick = logout;
}

function init() {
  try {
    const stored = localStorage.getItem('sb-hazyajkncrdfewkvnoww-auth-token');
    const rawSession = stored ? JSON.parse(stored) : null;
    if (rawSession && rawSession.user) session = { user: { id: rawSession.user.id || rawSession.user_id } };
  } catch {}
  if (location.hash === '') location.hash = '#/home';
  route();
}
window.addEventListener('load', init);
</script>
</body>
</html>
