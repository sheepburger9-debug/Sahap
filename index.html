// السلة بتتعرض من قراءة طازجة من الخادم، والمنتجات من المنيو الحالي
function cartLines(cart) {
  if (!cart || !R) return [];
  return cart.items.map((i) => ({ ...i, product: R.prodMap.get(i.product_id) }));
}

// السلة بقت في الهيدر (زرار السلة)، فالشريط اللي تحت اتشال
// شريط السلة العائم: بيظهر في صفحة المطعم بس لو فيه عناصر، ويوصّل لشاشة السلة
function drawCartBar() {
  if (!cartbar) return;
  const lines = R?.rest ? cartLines(R.cart) : [];
  const count = lines.reduce((n, i) => n + Number(i.quantity || 0), 0);
  if (!count) { cartbar.classList.add('hidden'); cartbar.innerHTML = ''; return; }
  const total = lines.reduce((s, i) => s + (i.product ? unitPrice(i.product, R.discounts) * Number(i.quantity || 0) : 0), 0);
  cartbar.innerHTML = `<span>${count} عنصر · ${money(total)}</span><a class="btn primary auto" href="#/cart/${esc(R.rest.slug)}">عرض السلة</a>`;
  cartbar.classList.remove('hidden');
}

// كل عمليات السلة بتتنفذ واحدة ورا التانية: ده بيمنع تضارب الكميات وإنشاء سلتين لنفس المطعم
let cartQueue = Promise.resolve();
function runCartOp(fn) {
  const run = cartQueue.then(fn, fn);
  cartQueue = run.catch(() => {});
  return run;
}

// المنتجات اللي عليها عملية شغالة دلوقتي: الضغطة المكررة عليها بتتجاهل
const pendingQty = new Set();
function setQtyBusy(productId, busy) {
  document.querySelectorAll('[data-act][data-id]').forEach((b) => {
    if (b.dataset.id === productId) b.disabled = busy;
  });
}

// تغيير كمية منتج: قراءة طازجة، تحقق من الحدود، تنفيذ، التحقق من عدد الصفوف، وإعادة تحميل السلة
async function applyQtyChange(productId, delta) {
  const cart = await getCart(R.rest.id, delta > 0);
  if (!cart) return; // مفيش سلة ومفيش إضافة = مفيش تغيير
  const existing = cart.items.find((i) => i.product_id === productId);
  const current = Number(existing?.quantity || 0);
  if (delta > 0 && current >= CART_MAX_QTY) throw cartError(`الحد الأقصى ${CART_MAX_QTY} قطعة من المنتج ده`);
  const next = current + delta;
  if (next < 0) return;

  if (existing) {
    const q = next <= 0
      ? sb.from('cart_items').delete().eq('id', existing.id).select('id')
      : sb.from('cart_items').update({ quantity: next }).eq('id', existing.id).select('id');
    const { data, error } = await q;
    if (error) throw cartError(CART_WRITE_FAIL, error);
    // صفر صفوف = السلة اتقفلت من الخادم (الدفع) أو الـRLS منعت العملية: منقولش إنها نجحت
    if (!data?.length) throw cartError('السلة اتغيرت أو اتقفلت، حدّث الصفحة');
  } else if (next > 0) {
    const { data, error } = await sb.from('cart_items')
      .insert({ cart_id: cart.id, product_id: productId, quantity: 1 }).select('id');
    if (error) throw cartError(CART_WRITE_FAIL, error);
    if (!data?.length) throw cartError('السلة اتغيرت أو اتقفلت، حدّث الصفحة');
  }

  // الواجهة بتتحدّث بس بعد ما السلة تتقري من الخادم بعد التعديل
  R.cart = await getCart(R.rest.id, false);
  R.cartFailed = false;
  redrawCurrent();
}

async function setQty(productId, delta) {
  if (!R?.rest) return;
  if (delta !== 1 && delta !== -1) return;
  // الإضافة لمنتج مش في المنيو الحالي ممنوعة؛ الإنقاص مسموح حتى لو المنتج اختفى
  if (delta > 0 && !R.prodMap?.has(productId)) return;
  if (pendingQty.has(productId)) return; // ضغطة مكررة على نفس المنتج
  pendingQty.add(productId);
  setQtyBusy(productId, true);
  try {
    if (!session) {
      guestSetQty(R.rest, productId, delta);
      R.cart = guestCartFor(R.rest.id);
      R.cartFailed = false;
      redrawCurrent();
    } else {
      await runCartOp(() => applyQtyChange(productId, delta));
    }
  } catch (e) {
    console.error('[setQty]', e);
    toast(arMsg(e, CART_WRITE_FAIL));
  } finally {
    pendingQty.delete(productId);
    setQtyBusy(productId, false);
  }
}

// رسالة مفهومة للعميل: رسائل الخادم بالعربي بتظهر كما هي، والباقي رسالة عامة
function arMsg(ex, fallback) {
  const m = String(ex?.message || '');
  return /[\u0600-\u06FF]/.test(m) ? m : fallback;
}

/* ============ السلة بدون تسجيل + شاشات السلة والتأكيد ============ */
const RET_KEY = 'sahap_return';   // الصفحة اللي العميل كان عايزها قبل تسجيل الدخول
const GUEST_KEY = 'sahap_guest_carts'; // سلات الجهاز: { [restaurantId]: { name, slug, items: { [productId]: qty } } }

function guestLoad() {
  try { return JSON.parse(localStorage.getItem(GUEST_KEY) || '{}') || {}; } catch { return {}; }
}
function guestSave(all) {
  try { localStorage.setItem(GUEST_KEY, JSON.stringify(all)); return true; }
  catch (e) { console.error('[guest-cart]', e); return false; }
}
function guestCartFor(restaurantId) {
  const g = guestLoad()[restaurantId];
  const items = Object.entries(g?.items || {})
    .map(([product_id, q]) => ({ product_id, quantity: Number(q) }))
    .filter((i) => i.quantity > 0);
  return { id: null, guest: true, coupon_code: null, items };
}
// تعديل كمية على سلة الجهاز: نفس الحدود (1 - 99) والحفظ بيتأكد منه
function guestSetQty(restaurant, productId, delta) {
  const all = guestLoad();
  const g = all[restaurant.id] || { items: {} };
  const current = Number(g.items[productId] || 0);
  if (delta > 0 && current >= CART_MAX_QTY) throw cartError(`الحد الأقصى ${CART_MAX_QTY} قطعة من المنتج ده`);
  const next = current + delta;
  if (next <= 0) delete g.items[productId]; else g.items[productId] = next;
  g.name = restaurant.name; g.slug = restaurant.slug;
  if (Object.keys(g.items).length) all[restaurant.id] = g; else delete all[restaurant.id];
  if (!guestSave(all)) throw cartError('تعذّر حفظ السلة على الجهاز، جرّب تاني');
}

// نقل سلة الجهاز لحساب العميل بعد تسجيل الدخول. السلة بتتشال من الجهاز بس لما النقل ينجح
let mergePromise = null;
function mergeGuestCarts() {
  if (!session) return Promise.resolve();
  if (!mergePromise) mergePromise = doMergeGuestCarts().finally(() => { mergePromise = null; });
  return mergePromise;
}
async function doMergeGuestCarts() {
  const all = guestLoad();
  for (const rid of Object.keys(all)) {
    const entries = Object.entries(all[rid].items || {})
      .map(([pid, q]) => [pid, Number(q)]).filter(([, q]) => q > 0);
    if (!entries.length) { delete all[rid]; continue; }
    try {
      await runCartOp(async () => {
        const cart = await getCart(rid, true);
        for (const [pid, q] of entries) {
          const existing = cart.items.find((i) => i.product_id === pid);
          const qty = Math.min(CART_MAX_QTY, Number(existing?.quantity || 0) + q);
          const op = existing
            ? sb.from('cart_items').update({ quantity: qty }).eq('id', existing.id).select('id')
            : sb.from('cart_items').insert({ cart_id: cart.id, product_id: pid, quantity: qty }).select('id');
          const { data, error } = await op;
          if (error || !data?.length) throw cartError(CART_WRITE_FAIL, error);
        }
      });
      delete all[rid];
    } catch (e) {
      console.error('[merge-guest-cart]', e); // بنسيب السلة في الجهاز عشان نحاول تاني
    }
  }
  guestSave(all);
}

// أي تغيير في الكمية بيحدّث الشاشة المفتوحة (المنيو أو سلة المشتريات) والهيدر
function redrawCurrent() {
  if (document.getElementById('menu')) drawMenu();
  if (document.getElementById('cartScreen')) drawCartScreen();

// سعر بعد الخصم للعرض فقط؛ الخادم بيحسب الإجمالي النهائي
async function loadDiscounts(products) {
  const map = new Map();
  const ids = (products || []).map((p) => p.id);
  if (!ids.length) return map;
  try {
    // الخادم بيرجع الخصومات النشطة بس (RLS)؛ ما نطلبش id ولا created_by ولا is_active
    const { data, error } = await sb.from('product_discounts')
      .select('product_id, discount_type, discount_value, starts_at, ends_at')
      .in('product_id', ids);
    if (error) { console.error('[discounts]', error); return map; }
    const now = Date.now();
    const priceOf = new Map(products.map((p) => [p.id, Number(p.price)]));
    for (const d of data || []) {
      if (d.starts_at && new Date(d.starts_at).getTime() > now) continue;
      if (d.ends_at && new Date(d.ends_at).getTime() <= now) continue;
      const price = priceOf.get(d.product_id);
      const v = Number(d.discount_value);
      if (price == null || !(price > 0) || !(v > 0)) continue;
      if (d.discount_type === 'percentage' && v > 100) continue;
      const newPrice = d.discount_type === 'percentage' ? price * (1 - v / 100) : price - v;
      if (!(newPrice >= 0) || newPrice >= price) continue;
      const rounded = Math.round(newPrice * 100) / 100;
      // نختار أفضل سعر فقط من الخصومات النشطة، من غير تجميع
      const cur = map.get(d.product_id);
      if (!cur || rounded < cur.newPrice) map.set(d.product_id, { newPrice: rounded });
    }
  } catch (ex) {
    console.error('[discounts]', ex);
  }
  return map;
}
function unitPrice(p, discounts) {
  const d = discounts?.get(p.id);
  return d ? d.newPrice : Number(p.price);
}

/* ---- إعلان "اقتراحات السلة" + منتجاته المربوطة ---- */
async function loadCartAd(restaurantId) {
  const inv = await sb.rpc('get_public_ad_inventory');
  if (inv.error) { console.error('[cart-ad]', inv.error); return { ad: null, productIds: [] }; }
  const placement = (inv.data || []).find((p) => p.placement_code === 'cart_suggestions');
  const camp = (placement?.campaigns || []).find((c) => c.restaurant_id === restaurantId);
  if (!camp) return { ad: null, productIds: [] };
  const links = await sb.from('ad_campaign_products')
    .select('product_id, display_order').eq('campaign_id', camp.campaign_id).order('display_order');
  if (links.error) { console.error('[cart-ad-products]', links.error); return { ad: camp, productIds: [] }; }
  return { ad: { ...camp, placement_code: placement.placement_code }, productIds: (links.data || []).map((l) => l.product_id) };
}
function cartAdHtml() {
  if (!R?.ad) return '';

    ? `<div class="sh-offer-rail cs-rail">${prods.map((p) => {

          <strong>${esc(p.name)}</strong>

          <button class="addbtn" type="button" data-act="inc" data-id="${esc(p.id)}">أضف</button>

    : '';
  return `<section class="cs-ad" aria-label="اقتراحات من المطعم">${adHtml(R.ad)}${rail}</section>`;
}

/* ---- شاشة 1: سلة المشتريات ---- */
async function viewCart([, slug]) {
  const my = ++rid;
  app.innerHTML = cartTopbar('سلة المشتريات', '#/cart') + '<p class="meta">جاري التحميل…</p>';
  const { data: r } = await sb.from('restaurants')
    .select('id, name, slug, delivery_fee, is_open').eq('slug', slug).maybeSingle();
  if (my !== rid) return;
  if (!r) { app.innerHTML = cartTopbar('السلة', '#/cart') + emptyHtml('المطعم ده مش متاح دلوقتي'); return; }

  await mergeGuestCarts();
  const [prods, cartRes, ad] = await Promise.all([
    sb.from('products').select('id, name, description, price, emoji, product_images(image_url, display_order)')
      .eq('restaurant_id', r.id).eq('is_available', true),
    loadCartSafe(r.id),
    loadCartAd(r.id),
  ]);
  if (my !== rid) return;
  if (prods.error) {
    console.error('[cart-products]', prods.error);
    app.innerHTML = cartTopbar('سلة المشتريات', '#/cart') + '<p class="err" role="alert">تعذّر تحميل منتجات المطعم. حدّث الصفحة.</p>';
    return;
  }
  const products = prods.data || [];
  const prodMap = new Map(products.map((p) => [p.id, p]));
  R = {
    rest: r, products, prodMap, menuCats: [], offers: [], reviews: [], methods: { cash: false, paymob: false },
    cart: cartRes.cart, cartFailed: cartRes.failed,
    discounts: await loadDiscounts(products),
    ad: ad.ad,
    adProducts: ad.productIds.map((id) => prodMap.get(id)).filter(Boolean),
  };
  app.innerHTML = cartTopbar(r.name, '#/cart') + '<div id="cartScreen" class="cs-screen"></div>';
  drawCartScreen();
}

function drawCartScreen() {
  const el = document.getElementById('cartScreen');
  if (!el || !R?.rest) return;
  const failed = R.cartFailed
    ? '<p class="err" role="alert">تعذّر تحميل السلة الحالية، والكميات ممكن تكون مش محدثة. حدّث الصفحة.</p>' : '';
  const lines = cartLines(R.cart);
  if (!lines.length && R.cartFailed) {
    el.innerHTML = failed + '<p style="margin-top:12px"><a class="btn" href="#/cart/' + esc(R.rest.slug) + '">حاول تاني</a></p>';
    return;
  }
  if (!lines.length) {
    el.innerHTML = failed + emptyHtml('السلة فاضية دلوقتي') +
      `<p style="margin-top:12px"><a class="btn" href="#/r/${esc(R.rest.slug)}">أضف منتجات من ${esc(R.rest.name)}</a></p>`;
    return;
  }
  const rows = lines.map((i) => {
    const p = i.product;
    if (!p) {
      return `<article class="product cs-line"><div class="grow"><strong>منتج مش متاح دلوقتي</strong>
        <p class="meta">شيله من السلة عشان تكمل الطلب</p>
        <span class="qty"><button data-act="dec" data-id="${esc(i.product_id)}" aria-label="احذف المنتج">🗑</button><span aria-live="polite">${i.quantity}</span></span></div></article>`;
    }
    const unit = unitPrice(p, R.discounts);
    const hasDisc = unit < Number(p.price);
    const img = safeUrl([...(p.product_images || [])].sort((a, b) => a.display_order - b.display_order)[0]?.image_url);
    return `<article class="product cs-line">
      ${img ? `<img class="thumb" src="${esc(img)}" alt="" loading="lazy">` : `<span class="thumb" aria-hidden="true">${esc(p.emoji || '•')}</span>`}
      <div class="grow"><strong>${esc(p.name)}</strong>
        <div class="pricerow"><span class="price">${money(unit * i.quantity)}</span>${hasDisc ? `<s class="meta">${money(Number(p.price) * i.quantity)}</s>` : ''}
          <span class="qty"><button data-act="dec" data-id="${esc(p.id)}" aria-label="${i.quantity === 1 ? 'احذف' : 'قلل'} ${esc(p.name)}">${i.quantity === 1 ? '🗑' : '−'}</button><span aria-live="polite">${i.quantity}</span><button data-act="inc" data-id="${esc(p.id)}" aria-label="زوّد ${esc(p.name)}">+</button></span>
        </div>
      </div>
    </article>`;
  }).join('');

  const priced = lines.filter((i) => i.product);
  const sub = priced.reduce((s, i) => s + unitPrice(i.product, R.discounts) * i.quantity, 0);
  const full = priced.reduce((s, i) => s + Number(i.product.price) * i.quantity, 0);
  const fee = Number(R.rest.delivery_fee || 0);
  const hasMissing = lines.some((i) => !i.product);
  el.innerHTML = `${failed}
    <div class="cs-lines">${rows}</div>
    ${cartAdHtml()}
    <div class="cs-sum">
      <div class="sum"><span>المجموع الفرعي</span><b>${money(sub)}</b></div>
      ${full > sub ? `<div class="sum"><span>خصم المنتجات</span><b>- ${money(full - sub)}</b></div>` : ''}
      <div class="sum"><span>رسوم التوصيل</span><b>${fee ? money(fee) : 'مجاني'}</b></div>
      <div class="sum total"><span>الإجمالي التقديري</span><b>${money(sub + fee)}</b></div>
      <p class="meta" style="margin-top:6px">ده إجمالي تقديري. الإجمالي النهائي بيتحدد عند التأكيد بعد الكوبون والعروض.</p>
    </div>
    <div class="cs-bottom">
      ${hasMissing
        ? '<button class="btn primary" type="button" disabled>تابع للدفع</button>'
        : `<a class="btn primary" href="#/checkout/${esc(R.rest.slug)}">تابع للدفع</a>`}
      <a class="btn" href="#/r/${esc(R.rest.slug)}">أضف المزيد</a>
    </div>`;
  observeAds(el);
}

        <div class="sum total"><span>الإجمالي التقديري</span><b>${money(sub + fee)}</b></div>
        <p class="meta" style="margin-top:6px">ده إجمالي تقديري. الإجمالي النهائي بيتحدد من السيرفر بعد تطبيق الكوبون والعروض.</p>

        <input id="cc" value="${esc(R.cart?.coupon_code || '')}" autocomplete="off">
        <fieldset>
          <legend>طريقة الدفع</legend>
          ${hasAny ? `
            ${m.cash ? `<label class="opt"><input type="radio" name="pm" value="cash" ${firstMethod === 'cash' ? 'checked' : ''}><span>الدفع عند الاستلام<small>ادفع كاش للمندوب</small></span></label>` : ''}
            ${m.paymob ? `<label class="opt"><input type="radio" name="pm" value="paymob" ${firstMethod === 'paymob' ? 'checked' : ''}><span>فيزا أو محفظة<small>دفع آمن عبر Paymob</small></span></label>` : ''}

// تأكيد الطلب: الكوبون لازم يتحفظ الأول، وزرار واحد بيقفل الإرسال المزدوج
function bindCheckoutForm(root, cart) {
  const form = root.querySelector('#coForm');
  const err = root.querySelector('#coErr');
  const btn = root.querySelector('#placeBtn');
  let placing = false;
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (placing) return;
    err.textContent = '';
    const name = root.querySelector('#cn').value.trim();
    const phone = root.querySelector('#cp').value.replace(/[\s-]/g, '');
    const addr = root.querySelector('#ca').value.trim();
    const coupon = root.querySelector('#cc').value.trim();
    const method = root.querySelector('input[name="pm"]:checked')?.value;

    if (!name) { err.textContent = 'اكتب اسمك'; return; }
    if (!PHONE_RE.test(phone)) { err.textContent = 'اكتب رقم موبايل مصري صحيح'; return; }
    if (addr.length < 5) { err.textContent = 'اكتب عنوان التوصيل بالتفصيل'; return; }
    if (!method) { err.textContent = 'اختار طريقة الدفع'; return; }

    placing = true;
    btn.disabled = true;
    btn.textContent = 'بنأكد طلبك…';
    try {
      const { data: saved, error: cErr } = await sb.from('carts')
        .update({ coupon_code: coupon || null }).eq('id', cart.id).select('id, coupon_code');
      if (cErr) throw cartError('تعذّر حفظ الكوبون، حاول تاني', cErr);
      if (!saved?.length) throw cartError('السلة اتغيرت أو اتقفلت، حدّث الصفحة');

      const { data: orderId, error } = await sb.rpc('place_order', {
        p_cart_id: cart.id,
        p_shipping_address: addr,
        p_customer_phone: phone,
        p_customer_name: name,
        p_payment_method: method,
      });
      if (error) throw error;
      if (!orderId) throw cartError('الطلب ما اتسجلش، حاول تاني');

      // الطلب اتسجل فعلاً: أي فشل بعد كده مش معناه إن الطلب فشل
      R.cart = null;
      refreshCartSummary().then(updateCartBtns);

      if (method === 'paymob') {
        // الطلب اتسجل خلاص؛ أي فشل هنا ما يرجعش المستخدم للفورم عشان ما يعملش طلب مكرر
        let iframeUrl = null;
        try {
          const { data, error: fnErr } = await sb.functions.invoke('paymob-initiate', { body: { order_id: orderId } });
          if (!fnErr && data?.iframe_url) iframeUrl = data.iframe_url;
        } catch (payEx) {
          console.error('[paymob-initiate]', payEx);
        }
        if (!iframeUrl) {
          toast('اتسجل طلبك، بس تعذّر فتح صفحة الدفع. ادفعه من صفحة طلباتي');
          location.hash = '#/orders';
          return;
        }
        location.href = iframeUrl;
        return;
      }
      toast('استلمنا طلبك ✓');
      location.hash = '#/orders';
    } catch (ex) {
      console.error('[place-order]', ex);
      placing = false;
      err.textContent = arMsg(ex, 'حصلت مشكلة في الاتصال، حاول تاني');
      btn.disabled = false;
      btn.textContent = 'تنفيذ الطلب';
    }
  });
}

async function viewOrders() {
  const my = ++rid;
  // نلغي أي مؤقت سابق قبل ما نجيب واحد جديد، عشان التحديث ما يتكررش ويتراكم
  clearInterval(pollTimer);
  pollTimer = null;
  app.innerHTML = topbar('طلباتي') + '<p class="meta">جاري التحميل…</p>';
  const { data, error } = await sb.from('orders')
    .select('id, status, total_amount, created_at, restaurants(name), payments(id, provider, status), order_items(product_name_snapshot, quantity)')
    .order('created_at', { ascending: false }).limit(30);
  if (my !== rid) return;
  if (error) { app.innerHTML = topbar('طلباتي') + emptyHtml('تعذّر تحميل طلباتك'); return; }
  const orders = data || [];

  app.innerHTML = topbar('طلباتي') + (orders.length
    ? orders.map(orderHtml).join('')
    : emptyHtml('لسه ماطلبتش حاجة. ابدأ من المطاعم.'));

  const waiting = orders.some((o) => o.status === 'pending' && (o.payments || []).some((p) => p.provider === 'paymob' && p.status === 'pending'));
  if (waiting) {
    pollTimer = setInterval(() => { if (location.hash === '#/orders') viewOrders(); }, 8000);
  }
}

async function payOrder(orderId, btn) {
  btn.disabled = true;
  const old = btn.textContent;
  btn.textContent = 'جاري التحويل…';
  let data = null, error = null;
  try {
    ({ data, error } = await sb.functions.invoke('paymob-initiate', { body: { order_id: orderId } }));
  } catch (ex) {
    console.error('[payOrder]', ex);
    error = ex;
  }
  if (error || !data?.iframe_url) {
    toast(await invokeError(error, 'تعذّر بدء الدفع'));
    btn.disabled = false;
    btn.textContent = old;
    return;
  }
  location.href = data.iframe_url;
}

/* ============ دخول / تسجيل ============ */
function viewLogin() {
  ++rid;
  let mode = 'login';
  const draw = () => {
    const isLogin = mode === 'login';
    app.innerHTML = topbar(isLogin ? 'ادخل حسابك' : 'أنشئ حساب') + `
      <form id="af" class="auth" novalidate>
        ${isLogin ? '' : `
          <label for="an">الاسم</label>
          <input id="an" required autocomplete="name">
          <label for="ap">رقم الموبايل</label>
          <input id="ap" inputmode="tel" required autocomplete="tel">`}
        <label for="ae">الإيميل</label>
        <input id="ae" type="email" required autocomplete="email">
        <label for="apw">كلمة السر</label>
        <input id="apw" type="password" minlength="6" required autocomplete="${isLogin ? 'current-password' : 'new-password'}">
        <p class="err" id="aErr" role="alert"></p>
        <button class="btn primary" id="aBtn" type="submit" style="margin-top:14px">${isLogin ? 'دخول' : 'إنشاء الحساب'}</button>
      </form>
      <button class="linkbtn" type="button" id="swap">${isLogin ? 'معييش حساب؟ أنشئ واحد' : 'عندي حساب بالفعل'}</button>`;

    $('#swap').onclick = () => { mode = isLogin ? 'register' : 'login'; draw(); };
    $('#af').onsubmit = async (e) => {
      e.preventDefault();
      const err = $('#aErr');
      const btn = $('#aBtn');
      err.textContent = '';
      const email = $('#ae').value.trim();
      const password = $('#apw').value;
      btn.disabled = true;
      try {
        if (isLogin) {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
          location.hash = '#/home';
        } else {
          const name = $('#an').value.trim();
          const phone = $('#ap').value.replace(/[\s-]/g, '');
          if (!name) throw new Error('اكتب اسمك');
          if (!PHONE_RE.test(phone)) throw new Error('اكتب رقم موبايل مصري صحيح');
          const { data, error } = await sb.auth.signUp({ email, password, options: { data: { full_name: name, phone } } });
          if (error) throw error;
          if (!data.session) {
            err.textContent = 'بعتنالك رسالة تأكيد على الإيميل. أكّده وبعدين ادخل.';
            btn.disabled = false;
            return;
          }
          location.hash = '#/home';
        }
      } catch (ex) {
        err.textContent = isLogin && ex.message && !/Invalid login/i.test(ex.message) ? ex.message : translateAuthError(ex.message);
        btn.disabled = false;
      }
    };
  };
  draw();
}

/* ============ الأحداث العامة (delegation) ============ */
app.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'inc') return setQty(b.dataset.id, 1);
  if (act === 'dec') return setQty(b.dataset.id, -1);
  if (act === 'pay') return payOrder(b.dataset.order, b);
  if (act === 'reload') return route();
  if (act === 'logout') return logout();
  if (act === 'cart') return openCartSheet();
  if (act === 'scroll') return document.getElementById(b.dataset.target)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  if (act === 'prod') return openProductSheet(b.dataset.id);
});

/* ============ الإقلاع ============ */
function registerSW() {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('service-worker.js').catch(() => {}));
  }
}

(async function boot() {
  registerSW();
  const { data } = await sb.auth.getSession();
  session = data.session;
  await loadProfile();
  await mergeGuestCarts();

  sb.auth.onAuthStateChange((event, s) => {
    // نأجل الاستدعاءات لبرّه الـ callback عشان نتفادى تعارض داخلي في المكتبة
    setTimeout(async () => {
      session = s;
      await loadProfile();
      if (event === 'SIGNED_IN') await mergeGuestCarts();
      if (event === 'SIGNED_IN' || event === 'SIGNED_OUT') route();
    }, 0);
  });

  if (!location.hash) location.hash = hasSeenWelcome() ? '#/home' : '#/welcome';
  else route();
})();
</script>
</body>
