<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A1F1B">
<meta name="description" content="سحاب: اطلب أكلك من أقرب المطاعم">
<title>سحاب</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23F2A511'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle' fill='%231A1F1B'%3Eس%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@14.3.0/swiper-bundle.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.min.css">
<link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1A1F1B; --ink-2:#5B645D; --line:#DDE3D8;
  --bg:#EEF2EA; --card:#FFFFFF;
  --saffron:#F2A511; --saffron-ink:#2A1C00;
  --tomato:#B8402A; --olive:#3E5B3A;
  --r:14px; --col-w:75%;
  /* نظام المسافات الموحد: يكبر مع الشاشة */
  --gap-sm:12px; --gap-md:clamp(14px,3.5vw,22px); --gap-lg:clamp(22px,6vw,32px);
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:clip;max-width:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"Reem Kufi",system-ui,sans-serif;margin:0;line-height:1.25}
p{margin:0}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
a{color:inherit}
input,textarea{font:inherit;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--saffron);outline-offset:0;border-color:transparent}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
label{display:block;font-size:13px;color:var(--ink-2);margin:14px 0 6px}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 120px}
body[data-page="home"] .wrap,body[data-page="restaurant"] .wrap{padding-bottom:110px}
.hidden{display:none!important}
.grow{flex:1;min-width:0}
.meta{font-size:13px;color:var(--ink-2)}
.err{color:var(--tomato);font-size:14px;min-height:0;margin-top:10px}
.sec{font-size:17px;margin:var(--gap-lg) 0 var(--gap-sm)}
.sub{margin:-6px 0 10px}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 6px;min-height:0}
.ttl{font-size:22px;font-weight:700}
.brand{font-family:"Reem Kufi",sans-serif;font-size:24px;font-weight:700;letter-spacing:0;line-height:1.2;display:inline-block;white-space:nowrap;flex-shrink:0}
.homelink{flex:none;width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.homelink svg,.tabbar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar i{font-size:18px;height:20px;line-height:20px;display:block}

/* ألوان أزرار سحاب عبر متغيرات Bootstrap (عشان hover ما يكسرش الألوان) */
.btn{--bs-btn-color:#fff;--bs-btn-bg:var(--ink);--bs-btn-border-color:transparent;--bs-btn-hover-color:#fff;--bs-btn-hover-bg:#2c332d;--bs-btn-hover-border-color:transparent;--bs-btn-active-color:#fff;--bs-btn-active-bg:#2c332d;--bs-btn-active-border-color:transparent;--bs-btn-disabled-color:#fff;--bs-btn-disabled-bg:var(--ink);--bs-btn-disabled-border-color:transparent;--bs-btn-focus-shadow-rgb:242,165,17}
.btn.primary{--bs-btn-color:var(--saffron-ink);--bs-btn-bg:var(--saffron);--bs-btn-hover-color:var(--saffron-ink);--bs-btn-hover-bg:#f7b832;--bs-btn-active-color:var(--saffron-ink);--bs-btn-active-bg:#f7b832;--bs-btn-disabled-color:var(--saffron-ink);--bs-btn-disabled-bg:var(--saffron)}
.btn.ghost{--bs-btn-color:var(--ink);--bs-btn-bg:transparent;--bs-btn-border-color:var(--ink);--bs-btn-hover-color:var(--ink);--bs-btn-hover-bg:transparent;--bs-btn-hover-border-color:var(--ink);--bs-btn-active-color:var(--ink);--bs-btn-active-bg:transparent;--bs-btn-active-border-color:var(--ink);--bs-btn-disabled-color:var(--ink);--bs-btn-disabled-bg:transparent;--bs-btn-disabled-border-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;border-radius:999px;padding:11px 18px;font-weight:600;width:100%;font-size:14px;text-decoration:none}
.btn.primary{background:var(--saffron);color:var(--saffron-ink)}
.btn.ghost{background:transparent;border:1px solid var(--ink);color:var(--ink)}
.btn.auto{width:auto}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{display:block;margin:16px auto 0;color:var(--olive);font-weight:600;padding:8px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
/* تصنيفات شاشة المطاعم: شريط أفقي قابل للسحب، ثابت فوق وانت بتنزل */
#sticky-head{position:sticky;top:54px;z-index:4;background:var(--bg);padding-bottom:6px}
#cats{flex-wrap:nowrap;overflow-x:auto;padding-bottom:0;background:none}
.sh-rot-item{display:none}
.sh-rot-item.is-on{display:block}
.sh-rot-item > .ad{height:168px;min-height:0;aspect-ratio:auto;max-width:none;margin:0 0 6px;border:0}
@media (min-width:600px){.sh-rot-item > .ad{height:196px}}
/* بلوكات شاشة المطاعم: قسم بخلفية مميزة، كل عمود 3 مطاعم تحت بعض، والأعمدة جنب بعض */
.sh-blk{background:#FBF1D6;border:1px solid #EBD9A4;border-radius:18px;padding:12px 0 8px}
.sh-blk > .sec{margin:0 12px 8px;font-size:16px}
.sh-blk > .sub{margin:-4px 12px 8px}
.sh-blk .sh-rail3{margin:0;padding:0 12px 4px;flex-direction:row;overflow-x:auto;scroll-snap-type:x mandatory}
.sh-blk .sh-rail3 .sh-col{flex:0 0 78%;width:78%;gap:8px}
.sh-blk .rcard{min-height:72px;border-radius:14px;margin:0}
.sh-blk .rcard-img{flex-basis:30%;min-height:72px}
.sh-blk .rcard-body{padding:8px 10px;gap:4px}
.sh-blk .rname{font-size:14px}
.sh-blk .rcard-line{font-size:12px}
.sh-blk .rcard-img .rcard-logo{width:36px;height:36px}
@media (min-width:768px){.sh-blk .sh-rail3 .sh-col{flex:0 0 calc((100% - 16px) / 3);width:auto}}
.sh-rot-item > .ad img{height:100%}
#cats .chip{white-space:nowrap}
.chip{white-space:nowrap;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;text-decoration:none;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

.search{margin:4px 0 6px}

.banners,.sh-banners{display:flex;gap:12px;overflow-x:auto;margin:6px -16px 0;padding:0 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.banners::-webkit-scrollbar{display:none}
.sh-banners{display:block;overflow:hidden}
.sh-banners .swiper-wrapper{display:flex}
.banner{flex:0 0 84%;scroll-snap-align:start;position:relative;overflow:hidden;min-height:140px;border-radius:20px;background:var(--saffron);color:var(--saffron-ink);padding:20px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;text-decoration:none}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.3}
.banner > *{position:relative}
.banner .bt{font-family:"Reem Kufi",sans-serif;font-size:19px;font-weight:700;line-height:1.2}
/* كروت الأقسام التسويقية أعلى الرئيسية: مربعة 1:1 ومستقلة عن كروت المطاعم */
.mkt-strip{display:flex;gap:var(--gap-sm);overflow-x:auto;margin:0 -16px var(--gap-lg);padding:4px 16px 8px;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.mkt-strip::-webkit-scrollbar{display:none}
.mkt-card{position:relative;flex:0 0 min(38vw,150px);aspect-ratio:1/1;overflow:hidden;border:0;border-radius:18px;background:linear-gradient(135deg,#3E5B3A,#1A1F1B);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;text-align:start;box-shadow:0 6px 16px rgba(26,31,27,.14);scroll-snap-align:start;transition:transform .2s ease}
.mkt-card:active{transform:scale(.98)}
.mkt-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.mkt-card::after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(to top,rgba(20,24,20,.85) 0%,rgba(20,24,20,.35) 45%,rgba(20,24,20,0) 70%)}
.mkt-card-fb{position:absolute;inset:0;display:grid;place-items:center;font-family:"Reem Kufi",sans-serif;font-size:64px;color:rgba(255,255,255,.22)}
.mkt-card{text-decoration:none}
.mkt-card-n{display:block;font-size:14px;font-weight:700;line-height:1.3}
.mkt-card-o{display:block;font-size:12px;font-weight:500;opacity:.9;margin-top:2px;line-height:1.35}
.mkt-card-t{position:relative;z-index:1;padding:10px 12px;font-family:"Reem Kufi",sans-serif;font-size:15px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.block{margin:0 0 var(--gap-lg);scroll-margin-top:72px}
/* تخصيص تصميم البلوك من إعدادات Supabase؛ القيم الافتراضية لا تغيّر المقاسات الحالية */
.block.sh-custom-block{padding:var(--blk-padding,0);border-radius:var(--blk-radius,0);background:var(--blk-bg,transparent);color:var(--blk-text,inherit);min-height:var(--blk-min-height,0);max-width:var(--blk-max-width,100%);margin-inline:auto}
.sh-block-head{display:flex;align-items:center;gap:10px;min-width:0;margin-bottom:0}
.sh-block-heading{flex:1;min-width:0}
.block.sh-custom-block .sec{font-family:var(--blk-font,"Reem Kufi",sans-serif);font-size:var(--blk-title-size,17px);font-weight:var(--blk-title-weight,700);color:var(--blk-title-color,inherit);margin:var(--gap-lg) 0 var(--gap-sm)}
.block.sh-custom-block .sub{font-family:var(--blk-font,"IBM Plex Sans Arabic",sans-serif);font-size:var(--blk-subtitle-size,13px);color:var(--blk-subtitle-color,var(--ink-2));margin:-6px 0 10px}
.sh-block-logo{width:42px;height:42px;flex:none;object-fit:contain;border-radius:10px;background:#fff}
.sh-block-badge-image{width:42px;height:42px;flex:none;object-fit:contain}
.sh-block-badge{flex:none;max-width:35%;padding:4px 10px;border-radius:999px;background:var(--saffron);color:var(--saffron-ink);font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.block .rail{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.sh-col{flex:0 0 84%;min-width:0;scroll-snap-align:start;display:flex;flex-direction:column;gap:12px}
.sh-col .rcard{margin:0}
.block .rail::-webkit-scrollbar{display:none}
.mini{flex:0 0 150px;text-decoration:none;display:flex;flex-direction:column;gap:4px}
.cover{height:96px;border-radius:12px;background:#D9E1D2;overflow:hidden;display:grid;place-items:center;font-family:"Reem Kufi",sans-serif;font-size:32px;color:var(--olive)}
.cover img{width:100%;height:100%;object-fit:cover}
.mini strong{font-size:15px}
/* كارت المطعم: نص على الشمال، والصورة في مربع على اليمين، والعرض فوق الصورة */
.rcard{display:flex;align-items:stretch;min-height:88px;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;margin:0 0 12px}
.rcard-img{position:relative;flex:0 0 36%;min-height:88px;border-inline-start:1px solid var(--line);background:#fff;overflow:hidden;display:grid;place-items:center}
.rcard-img img{display:block;width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.rcard-fb{font-family:"Reem Kufi",sans-serif;font-size:32px;color:var(--olive)}
.rcard-img .badge{position:absolute;bottom:6px;left:6px;margin:0;font-weight:700;font-size:12px;padding:3px 10px;z-index:1}
.rcard-img .rcard-logo{position:absolute;inset:auto;top:6px;right:6px;width:44px;height:44px;border-radius:10px;object-fit:cover;background:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2);z-index:1}
.rcard-fav{position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;z-index:1;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.rcard-fav svg{width:16px;height:16px;fill:#5B645D}
.rcard-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:12px 14px}
.rcard .rname{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:26px}
.rcard-top .badge{margin:0;min-width:0;max-width:calc(100% - 34px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;font-size:12px;padding:3px 10px;line-height:1.4}
.rcard-top .rcard-fav{position:static;flex:none;width:26px;height:26px}
/* نظام الشارات الموحد (مطاعم + منتجات): الخلفية والنص والأيقونة مستقلين */
.sh-badge{display:inline-flex;align-items:center;gap:4px;max-width:100%;box-sizing:border-box;vertical-align:middle;line-height:1.4}
.sh-badge-text{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-badge-icon{display:inline-flex;flex:none;width:1em;height:1em;font-size:1em;line-height:1}
.sh-badge-icon svg{display:block;width:100%;height:100%;fill:currentColor}
.sh-badge--pill{border-radius:999px}
.sh-badge--rounded{border-radius:8px}
.sh-badge--rectangle{border-radius:2px}
.sh-badge--ribbon{border-radius:0;padding-inline:12px;clip-path:polygon(0 0,100% 0,calc(100% - 7px) 50%,100% 100%,0 100%,7px 50%)}
.sh-badge--circle{border-radius:50%;aspect-ratio:1/1;min-width:2.4em;justify-content:center;text-align:center;padding:0 .4em}
.sh-badge--circle .sh-badge-text{white-space:normal;overflow:visible;text-overflow:clip}
.sh-badge--no-bg{background:transparent}
.rcard-top .sh-badge{display:inline-flex}
.rcard-line{font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcard-line .star{color:var(--saffron)}
.ad{display:block;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:var(--gap-md) 0}
.ad img{display:block;width:100%;height:auto;max-height:200px;object-fit:cover}
.ad-body{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.ad-tag{font-size:11px;color:var(--ink-2)}
.ad-title{font-family:"Reem Kufi",sans-serif;font-size:16px;font-weight:700}
/* ===== أنواع اللافتات الخمسة ===== */
.ad,.ad *{max-width:100%;overflow-wrap:anywhere}
.ad:focus-visible{outline:3px solid var(--saffron);outline-offset:3px}

/* hero: بانر رئيسي عريض */
.ad--hero{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:132px;border:0;background:var(--ink);color:#EEF2EA}
.ad--hero img{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:cover;opacity:.45}
.ad--hero .ad-body{position:relative;padding:20px;display:flex;flex-direction:column;gap:4px}
.ad--hero .ad-title{font-size:19px;line-height:1.2;color:#fff}
.ad--hero .meta,.ad--hero .ad-tag{color:#D9E1D2}

/* horizontal: صورة جانبية والنص بجانبها */
.ad--horizontal{display:flex;align-items:stretch;min-height:96px;border:0;background:#FFF3D6;color:var(--ink)}
.ad--horizontal img{position:static;width:112px;flex:0 0 112px;height:auto;max-height:none;object-fit:cover}
.ad--horizontal .ad-body{flex:1;min-width:0;padding:12px 14px;display:flex;flex-direction:column;justify-content:center;gap:2px}

/* square: لافتة مربعة 1:1 */
.ad--square{position:relative;display:flex;flex-direction:column;justify-content:flex-end;aspect-ratio:2/1;width:100%;max-width:none;margin-inline:0;border:0;background:var(--olive);color:#EEF2EA}
.ad--square img{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:cover;opacity:.55}
.ad--square .ad-body{position:relative;padding:18px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(transparent,rgba(26,31,27,.85))}
.ad--square .ad-title{font-size:16px;line-height:1.25;color:#fff}
.ad--square .meta,.ad--square .ad-tag{color:#D9E1D2}

/* vertical: لافتة طولية للمساحات الضيقة */
.ad--vertical{position:relative;display:flex;flex-direction:column;justify-content:flex-end;aspect-ratio:2/3;width:100%;max-width:170px;margin-inline:auto;border:0;background:var(--saffron);color:var(--saffron-ink)}
.ad--vertical img{position:absolute;inset:0;width:100%;height:100%;max-height:none;object-fit:cover;opacity:.5}
.ad--vertical .ad-body{position:relative;padding:14px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(transparent,rgba(42,28,0,.75))}
.ad--vertical .ad-title{font-size:15px;line-height:1.25;color:#fff}
.ad--vertical .meta,.ad--vertical .ad-tag{color:#FFF3D6}

/* featured: لافتة مميزة بإطار واضح وشارة «مطعم مميز» */
.ad--featured{border:2px solid var(--saffron);background:#FFFBF0;color:var(--ink);box-shadow:0 6px 18px rgba(242,165,17,.22)}
.ad--featured img{width:100%;height:110px;max-height:none;object-fit:cover}
.ad--featured .ad-body{padding:14px 16px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.ad--featured .ad-tag{background:var(--saffron);color:var(--saffron-ink);font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px}
.ad--featured .ad-title{font-size:16px}

/* تجاوب الشاشات الصغيرة والكبيرة */
@media (max-width:360px){
  .ad--hero{min-height:120px}
  .ad--hero .ad-title{font-size:17px}
  .ad--horizontal img{width:88px;flex-basis:88px}
  .ad--square .ad-title{font-size:15px}
}
@media (min-width:600px){
  .ad--hero{min-height:200px}
  .ad--square{aspect-ratio:3/1}
}

.sh-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.rname{font-size:15px;font-weight:600}
.thumb{width:72px;height:72px;flex:none;border-radius:12px;background:#D9E1D2;object-fit:cover;display:grid;place-items:center;font-size:28px;color:var(--olive);font-family:"Reem Kufi",sans-serif}
img.thumb{display:block}
.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;margin-top:4px}

.hero{height:170px;border-radius:18px;overflow:hidden;background:var(--olive);display:grid;place-items:center;margin-top:4px}
.hero img{width:100%;height:100%;object-fit:cover}
.hero-fb{font-family:"Reem Kufi",sans-serif;font-size:72px;color:#EEF2EA}
.rhead{font-size:26px;margin:14px 0 4px}
.facts{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:14px;color:var(--ink-2)}
.offerbox{background:#fff;border-radius:var(--r);padding:14px;margin-top:14px;border-inline-start:4px solid var(--saffron)}
.menucats{position:sticky;top:44px;z-index:4;background:var(--bg);padding-bottom:4px}

.product{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.price{font-weight:700;color:var(--olive)}
.pricerow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px}
.addbtn{background:var(--ink);color:#fff;border-radius:999px;padding:7px 16px;font-size:14px;font-weight:600}
.qty{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.qty button{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;font-size:18px;line-height:1}
.qty span{min-width:20px;text-align:center;font-weight:700}

.review{padding:12px 0;border-bottom:1px solid var(--line)}
.stars{color:var(--saffron);letter-spacing:1px}

.cartbar{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));inset-inline:12px;max-width:496px;margin:0 auto;background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:9;box-shadow:0 10px 30px rgba(20,28,22,.25)}

.topbar-end{display:flex;align-items:center;gap:8px;flex:none}
.cartbtn{position:relative;flex:none;width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center}
.cartbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cartcount{position:absolute;top:-4px;inset-inline-start:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--saffron);color:var(--saffron-ink);font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.tabbar{display:none;position:fixed;bottom:max(12px,env(safe-area-inset-bottom));inset-inline:12px;max-width:496px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:22px;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;box-shadow:0 8px 24px rgba(20,28,22,.12);z-index:10}
body[data-page="home"] .tabbar{display:grid}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;color:var(--ink-2);text-decoration:none;font-size:12px;line-height:1.3;padding:8px 2px;border-radius:16px;transition:background-color .2s ease,color .2s ease}
.tabbar a[aria-current="page"]{color:var(--ink);font-weight:700;background:#FFF3D6}

.backdrop{position:fixed;inset:0;background:rgba(14,20,15,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px max(22px,env(safe-area-inset-bottom));max-height:90vh;max-height:90dvh;overflow:auto}
.sheet h2{font-size:22px;margin-bottom:4px}
.sum{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}
.sum.total{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:700;font-size:17px}
.opt{display:flex;gap:10px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:8px 0;font-size:15px;color:var(--ink);cursor:pointer}
.opt input{width:auto;accent-color:var(--ink)}
.opt small{display:block;color:var(--ink-2)}
fieldset{border:0;margin:14px 0 0;padding:0}
legend{font-size:13px;color:var(--ink-2);padding:0;margin-bottom:4px}
.inline{display:flex;gap:8px}
.inline input{flex:1}

.order{background:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px}
.between{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pill{display:inline-block;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--bg);margin-top:8px}
.order .btn{margin-top:10px}

.auth{background:#fff;border-radius:18px;padding:18px;margin-top:8px}
.points{background:#fff;border-radius:var(--r);padding:16px;margin:10px 0 4px;font-size:16px}
.points b{font-family:"Reem Kufi",sans-serif;font-size:26px;color:var(--olive)}
.points.err{color:var(--tomato)}
.acct form{background:#fff;border-radius:18px;padding:16px;margin-top:10px}
.acct .btn{margin-top:16px}

.sh-toast{position:fixed;top:12px;inset-inline:12px;max-width:496px;margin:0 auto;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;z-index:40;font-size:14px}
.empty{text-align:center;padding:48px 16px;color:var(--ink-2)}
.center{text-align:center}

@media (orientation: landscape){
  .wrap{padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right))}
  .topbar{padding-inline:0}
  .tabbar,.cartbar,.sh-toast{inset-inline-start:max(12px,env(safe-area-inset-left));inset-inline-end:max(12px,env(safe-area-inset-right))}
}
/* تدرّج العرض: الهاتف يفضل بشكله الأصلي، والشاشات الأكبر بتوسّع المحتوى تدريجياً */
@media (min-width:600px){
  .wrap{max-width:720px}
  .tabbar,.cartbar,.cs-bottom,.sh-toast{max-width:696px}
  .mkt-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));overflow:visible;margin:0 0 var(--gap-lg);padding:0}
  .mkt-card{flex:none;width:100%}
  .sh-col{flex:0 0 min(84%,300px)}
  #list .rcard{margin:0}
  .banner{flex:0 0 min(60%,360px)}
}
/* تابلت عمودي: 768px فأكثر، شبكة المطاعم بعمودين */
@media (min-width:768px){
  .wrap{max-width:900px}
  .tabbar,.cartbar,.cs-bottom,.sh-toast{max-width:876px}
}
/* ديسكتوب: 1024px فأكثر، شبكة المطاعم بثلاث أعمدة */
@media (min-width:1024px){
  .wrap{max-width:1120px}
  .tabbar,.cartbar,.cs-bottom,.sh-toast{max-width:1096px}
  .mkt-strip{grid-template-columns:repeat(5,minmax(0,1fr))}
  .sh-col{flex:0 0 min(84%,320px)}
}
/* شاشات واسعة جداً */
@media (min-width:1400px){
  .wrap{max-width:1240px}
  .tabbar,.cartbar,.cs-bottom,.sh-toast{max-width:1216px}
}
/* منطقة تنبيهات SweetAlert2 ما تمنعش الضغط على الصفحة اللي تحتها */
.swal2-container{pointer-events:none}
.swal2-container .swal2-popup{pointer-events:auto}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
/* بلوك العروض وسلايدر الإعلانات */
.sh-offers{margin-top:10px}
/* بلوكات المنتجات: كارت منتج صغير داخل شبكة مرنة، بدون تمدد أفقي */
.sh-prod-wrap{display:flex;flex-direction:column;gap:14px;min-width:0;margin-top:10px}
.sh-prod-group{display:flex;flex-direction:column;gap:10px;min-width:0}
.sh-prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,130px),1fr));gap:10px;min-width:0;margin-top:10px}
.pcard{display:flex;flex-direction:column;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;color:inherit}
.pcard-media{display:grid;place-items:center;aspect-ratio:4/3;background:var(--bg);font-size:clamp(24px,7vw,32px);line-height:1;font-weight:700;color:var(--ink-2)}
.pcard-body{display:flex;flex-direction:column;gap:2px;padding:8px 10px 10px;min-width:0;overflow-wrap:anywhere}
.pcard-rest{font-size:12px;line-height:1.3}
.pcard-badges{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:2px;min-width:0;font-size:11px}
.pcard-name{font-family:"Reem Kufi",sans-serif;font-size:14px;font-weight:700;line-height:1.3}
.pcard-desc{font-size:12px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard-price{margin-top:4px;font-weight:700;font-size:14px;color:var(--olive)}
.pcard:focus-visible{outline:3px solid var(--saffron);outline-offset:3px}
/* منتجات البلوك: صف أفقي واحد قابل للسحب والتمرير، والكرت بعرض ثابت ومتجاوب */
.sh-products-track{display:flex;flex-direction:row;flex-wrap:nowrap;gap:12px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:thin;padding:4px 12px 10px;margin-top:6px;min-width:0}
.sh-products-track > .pcard{flex:0 0 clamp(145px,42vw,210px);min-width:0;scroll-snap-align:start}
.sh-products-track::-webkit-scrollbar{height:6px}
.sh-products-track::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}
.sh-offer-rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 0 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sh-offer-rail::-webkit-scrollbar{display:none}
.offer-card{flex:0 0 min(70%,260px);scroll-snap-align:start;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-decoration:none;color:inherit;min-width:0}
.offer-card-img{display:block;position:relative;aspect-ratio:16/9;background:var(--bg);overflow:hidden}
.offer-card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.offer-card-fb{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:28px;color:var(--ink-2)}
.offer-card-body{display:flex;flex-direction:column;gap:2px;padding:10px 12px;min-width:0;overflow-wrap:anywhere}
.offer-card-t{font-family:"Reem Kufi",sans-serif;font-size:15px;font-weight:700;line-height:1.3}
.offer-card:focus-visible{outline:3px solid var(--saffron);outline-offset:3px}
.sh-ad-slider{overflow:hidden;touch-action:pan-y}
.sh-ad-slider .swiper-slide{height:auto}
.sh-ad-slider .swiper-slide > .ad{margin:var(--gap-sm) 0 0}
.sh-ad-slider .swiper-pagination{position:relative;bottom:auto;margin-top:4px}
@media (prefers-reduced-motion: reduce){.sh-offer-rail{scroll-behavior:auto}}
/* الإعلان المميز (مستقل عن كارت المطعم): خلفية داكنة، صورة، شعار واسم المطعم */
.ad-feat-wrap{margin:var(--gap-md) 0;min-width:0}
.ad--featured{position:relative;display:flex;flex-direction:column;margin:0;padding:0;border:0;border-radius:var(--r);overflow:hidden;background:var(--olive);color:#EEF2EA;box-shadow:0 8px 22px rgba(26,31,27,.18);text-decoration:none;min-width:0}
.ad--featured:focus-visible{outline:3px solid var(--saffron);outline-offset:3px}
.ad-feat-media{position:relative;display:block;aspect-ratio:16/8;background:#2b3429;overflow:hidden}
.ad-feat-media:empty{display:none}
.ad-feat-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-height:none}
.ad-feat-body{position:relative;display:flex;flex-direction:column;gap:6px;padding:14px 16px 16px;min-width:0}
.ad-feat-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.ad-feat-logo{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--saffron);background:#fff;flex:0 0 36px}
.ad-feat-name{font-weight:700;font-size:14px;min-width:0;overflow-wrap:anywhere}
.ad--featured .ad-tag{background:var(--saffron);color:var(--saffron-ink);font-weight:700;font-size:12px;padding:2px 10px;border-radius:999px}
.ad--featured .ad-title{font-family:"Reem Kufi",sans-serif;font-size:18px;line-height:1.25;color:#fff;overflow-wrap:anywhere}
.ad--featured .meta{color:#D9E1D2;overflow-wrap:anywhere}
/* سلايدر الإعلانات: لو Swiper مش متفعّل، العناصر تفضل ظاهرة في شريط أفقي بالسحب */
.sh-ad-slider{overflow:hidden;touch-action:pan-y;width:100%;min-width:0}
.sh-ad-slider .swiper-slide{height:auto;min-width:0}
.sh-ad-slider .swiper-slide > .ad{margin:var(--gap-sm) 0 0}
.sh-ad-slider .swiper-pagination{position:relative;bottom:auto;margin-top:4px}
.sh-ad-slider:not(.swiper-initialized){display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px}
.sh-ad-slider:not(.swiper-initialized)::-webkit-scrollbar{display:none}
.sh-ad-slider:not(.swiper-initialized) .swiper-wrapper{display:contents}
.sh-ad-slider:not(.swiper-initialized) .swiper-slide{flex:0 0 86%;max-width:86%;scroll-snap-align:start}
.sh-ad-slider:not(.swiper-initialized) .swiper-pagination{display:none}
@media (min-width:768px){.sh-ad-slider:not(.swiper-initialized) .swiper-slide{flex-basis:min(48%,420px);max-width:min(48%,420px)}}
/* شاشات السلة */
.cs-screen{padding-bottom:150px}
.cs-lines{margin-top:8px}
.cs-line .qty button{min-width:36px;min-height:36px}
.cs-sum{margin-top:16px;padding:12px 0;border-top:1px solid var(--line,#e5e9e2)}
.cs-bottom{position:fixed;bottom:0;inset-inline:0;max-width:496px;margin:0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:#fff;border-top:1px solid var(--line,#e5e9e2);display:flex;gap:10px;z-index:8}
.cs-bottom > *{flex:1;text-align:center;text-decoration:none}
.cs-ad{margin:16px 0}
.cs-rail{margin-top:10px}
.cs-prod{flex:0 0 150px;scroll-snap-align:start;background:#fff;border:1px solid var(--line,#e5e9e2);border-radius:var(--r,14px);padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cs-prod strong{overflow-wrap:anywhere;font-size:14px}
.cs-prod-img{display:grid;place-items:center;height:72px;border-radius:10px;background:var(--bg,#f4f6f2);font-size:32px;overflow:hidden}
.cs-prod-img img{width:100%;height:100%;object-fit:cover}
.co-page{padding-bottom:24px}


/* ============ شاشة الترحيب (Onboarding) ============ */
.welcome{min-height:calc(100dvh - 40px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px 8px}
.welcome-logo{width:112px;height:112px;border-radius:28px;background:var(--saffron);color:var(--ink);display:grid;place-items:center;font-family:"Reem Kufi",sans-serif;font-size:58px;box-shadow:0 10px 26px rgba(26,31,27,.18)}
.welcome h1{margin:6px 0 0;font-size:30px;color:var(--ink)}
.welcome p{margin:0;color:var(--ink-2);font-size:15px;line-height:1.7;max-width:320px}
.welcome-btn{margin-top:18px;min-width:220px;min-height:48px;padding:12px 24px;border:0;border-radius:16px;background:var(--ink);color:#fff;font-family:inherit;font-weight:700;font-size:16px;line-height:1.2;cursor:pointer}
.welcome-btn:focus-visible{outline:3px solid var(--saffron);outline-offset:3px}

/* ============ صفحة المطعم: الشعار وتفاصيل المنتج ============ */
.rhead-row{display:flex;align-items:center;gap:12px;margin-top:10px}
.rhead-row .rhead{margin:0;min-width:0}
.rlogo{width:56px;height:56px;flex:none;border-radius:14px;object-fit:cover;border:1px solid var(--line);background:#fff}
.prod-open{flex:none;padding:0;border:0;background:none;cursor:pointer;border-radius:12px}
.prod-name{padding:0;border:0;background:none;text-align:start;cursor:pointer;font:inherit;color:inherit}
.prod-open:focus-visible,.prod-name:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.psa-img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:var(--bg)}
.psa-fb{display:grid;place-items:center;font-size:56px}
.psa-name{font-size:20px;margin:12px 0 6px}
.psa-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.psa-actions{margin-top:14px;display:flex;justify-content:flex-end}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:6;pointer-events:none}

/* ============ تحجيم الهاتف (أقل من 600px) ============
   الهدف: عناصر أصغر ومتناسبة مع الشاشة. البلوكات أصغر ما يكون،
   والمطاعم الفردية والإعلانات أكبر بشوية منها. */
@media (max-width:599px){
  /* عناصر عامة: أيقونات وصور مصغرة */
  .thumb{width:56px;height:56px;font-size:22px;border-radius:10px}
  .cs-prod-img{height:56px;font-size:24px}
  .cartbtn{width:36px;height:36px}
  .cartbtn svg{width:18px;height:18px}
  .tabbar i{font-size:16px;height:18px;line-height:18px}
  .tabbar a{font-size:11px;padding:6px 2px}
  .ttl{font-size:18px}
  .brand{font-size:20px}
  .rhead{font-size:21px;margin:10px 0 4px}
  .rhead-row .rlogo{width:44px;height:44px;border-radius:12px}
  .hero{height:130px;border-radius:14px}
  .hero-fb{font-size:56px}
  .rcard-fav{width:24px;height:24px}
  .rcard-fav svg{width:13px;height:13px}
  .rcard-img .rcard-logo{width:34px;height:34px;border-radius:9px}
  .mkt-card{flex:0 0 min(34vw,120px)}
  .mkt-card-n{font-size:12px}
  .mkt-card-t{font-size:13px;padding:8px 9px}
  .banner{min-height:112px;padding:14px;border-radius:16px}
  .banner .bt{font-size:16px}

  /* المطاعم الفردية (خارج البلوكات): أكبر شوية */
  .rcard{min-height:80px;border-radius:14px;margin:0 0 10px}
  .rcard-img{flex-basis:34%;min-height:80px}
  .rcard-body{padding:10px 12px;gap:4px}
  .rcard .rname{font-size:15px}
  .rcard-line{font-size:12px}

  /* الإعلانات: أكبر شوية من البلوكات، وصورها أقصر */
  .ad{margin:10px 0}
  .ad img{max-height:170px}
  .ad-title{font-size:15px}
  .ad-body{padding:10px 12px}
  .ad--hero{min-height:112px}
  .ad--hero .ad-title{font-size:17px}
  .ad--horizontal{min-height:80px}
  .ad--horizontal img{width:92px;flex-basis:92px}
  .ad--featured .ad-title{font-size:15px}
  .ad-feat-media{aspect-ratio:16/7}

  /* البلوكات: أصغر حجم */
  .sh-blk{padding:8px 0 6px;border-radius:14px}
  .sh-blk > .sec{font-size:14px;margin:0 10px 6px}
  .sh-blk .sh-rail3 .sh-col{flex:0 0 68%;width:68%;gap:6px}
  .sh-blk .rcard{min-height:60px;border-radius:12px}
  .sh-blk .rcard-img{flex-basis:28%;min-height:60px}
  .sh-blk .rcard-body{padding:6px 8px;gap:3px}
  .sh-blk .rname{font-size:12px}
  .sh-blk .rcard-line{font-size:11px}
  .sh-blk .rcard-img .rcard-logo{width:28px;height:28px;border-radius:8px}
  .sh-blk .rcard-top{min-height:20px}
  .sh-blk .rcard-top .badge{font-size:10px;padding:2px 7px}
  .block .rail{gap:8px}
  .sh-col{flex:0 0 78%}
}

/* ============ ضبط نهائي للهاتف: فرق واضح بين المطعم العادي والمطعم داخل البلوك ============ */
@media (max-width:599px){
  /* مسافة أصغر بين المطاعم العادية */
  #list.row{--bs-gutter-y:0}
  #list .rcard{min-height:66px;margin:0 0 6px;border-radius:12px}
  #list .rcard-img{flex-basis:30%;min-height:66px}
  #list .rcard-body{padding:7px 10px;gap:3px}
  #list .rcard .rname{font-size:14px}
  #list .rcard-line{font-size:11.5px}
  #list .rcard-img .rcard-logo{width:30px;height:30px;border-radius:8px}

  /* المطعم داخل البلوك: أصغر بوضوح */
  .sh-blk .rcard{min-height:50px;border-radius:10px;margin:0}
  .sh-blk .rcard-img{flex-basis:26%;min-height:50px}
  .sh-blk .rcard-body{padding:5px 7px;gap:2px}
  .sh-blk .rname{font-size:11.5px}
  .sh-blk .rcard-line{font-size:10px}
  .sh-blk .rcard-img .rcard-logo{width:24px;height:24px;border-radius:7px}
  .sh-blk .rcard-fav{display:none}
  .sh-blk .sh-rail3 .sh-col{flex:0 0 62%;width:62%;gap:4px}
  .sh-blk{padding:6px 0 5px;background:#FFF6DF}

  /* مسافة أكبر بين البلوك والمطاعم اللي بعده */
  .block{margin:0 0 18px}
  #list > div:has(.sh-blk){margin-bottom:18px}
}

/* ============ تعديل البلوك على الهاتف: كارت أقصر وأعرض، ومسافة أكبر حوله ============ */
@media (max-width:599px){
  .sh-blk .sh-rail3 .sh-col{flex:0 0 84%;width:84%}
  .sh-blk .rcard{min-height:40px}
  .sh-blk .rcard-img{flex-basis:22%;min-height:40px}

<script>
/* ============ الإعداد ============ */
// المفتاح ده publishable (عام وآمن للكود العام). الأسرار موجودة على سوبابيز بس.
const SB_URL = 'https://hazyajkncrdfewkvnoww.supabase.co';
const SB_KEY = 'sb_publishable_9Kf6dTQTqI9h7-yGALWMWg_bjPzM6Zu';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

/* ============ أدوات مساعدة ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => `${Number(n || 0).toLocaleString('ar-EG', { maximumFractionDigits: 2 })} ج.م`;

};
const PHONE_RE = /^(\+?20)?01[0125][0-9]{8}$/;

/* ===== معالجة موحدة لأخطاء التحميل =====
   كل فشل قراءة بيتسجل في الـconsole بتفاصيله، والمستخدم بيشوف رسالة واحدة عامة (من غير تفاصيل داخلية) */
let loadErrors = [];
function resetLoadErrors() { loadErrors = []; }
function loadFail(label, err) {
  const msg = err && (err.message || err.reason || String(err)) || 'unknown';
  console.error('[load:' + label + ']', msg, err && err.code ? '(code ' + err.code + ')' : '');
  loadErrors.push(label);
}
const LOAD_FAIL_TXT = 'تعذّر تحميل بعض المحتوى، تأكد من الاتصال وحاول تاني';
function loadErrorHtml() {
  return `<div class="empty" role="alert"><p>${esc(LOAD_FAIL_TXT)}</p><button class="btn primary auto" type="button" data-act="reload">إعادة المحاولة</button></div>`;
}
/* فرق التوقيت بين جهاز العميل وSupabase: لو الهيدر Date متاح للمتصفح بنصحح بيه، ولو لأ الفرق صفر */
let serverClockOffset = 0;
(async function syncServerClock() {
  try {
    const t0 = Date.now();
    const res = await fetch(SB_URL + '/auth/v1/health', { headers: { apikey: SB_KEY } });
    const d = res.headers.get('date');
    if (d && Number.isFinite(Date.parse(d))) serverClockOffset = Date.parse(d) - (t0 + (Date.now() - t0) / 2);
  } catch (_) { /* الفرق يفضل صفر */ }
})();
const nowMs = () => Date.now() + serverClockOffset;

let session = null;
let profile = null;
let rid = 0;          // رقم العرض الحالي، عشان نتجاهل ردود قديمة
let pollTimer = null;
let R = null;         // حالة صفحة المطعم الحالية

// واجهة موحدة للرسائل: SweetAlert2 لو اتحمّل، ولو لأي سبب لأ يرجع لرسالة بسيطة
// سلايدر سوايبر: بيتعمل بعد رسم الصفحة وبيتدمر قبل أي صفحة جديدة، ومفيهوش تكرار للإعلانات
let homeSwiper = null;
function destroyHomeSwiper() {
  if (!homeSwiper) return;
  try { homeSwiper.destroy(true, true); } catch (_) {}
  homeSwiper = null;
}
function mountHomeSwiper() {
  destroyHomeSwiper();
  const el = app.querySelector('.sh-banners');
  if (!el || !window.Swiper) return;
  try {
    homeSwiper = new window.Swiper(el, {
      slidesPerView: 'auto', spaceBetween: 12, grabCursor: true,
      rtl: document.documentElement.dir === 'rtl', watchOverflow: true,
      rewind: true, speed: reduceMotion() ? 0 : 450,
      // تشغيل تلقائي كل 5 ثوانٍ؛ بيقف مؤقتاً مع اللمس/الماوس ويرجع بعد التفاعل، ومقفول مع تقليل الحركة
      autoplay: reduceMotion() ? false : { delay: 5000, disableOnInteraction: false, pauseOnMouseEnter: true },
    });
  } catch (e) { console.error('[swiper]', e); homeSwiper = null; }
}
// AOS: الأنيميشن بيتطبق بس لو المكتبة اتحملت وكمان المستخدم مش طالب تقليل الحركة
const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function aosAttr() { return window.AOS && !reduceMotion() ? ' data-aos="fade-up"' : ''; }
function aosRefresh() {
  if (!window.AOS || reduceMotion()) return;
  try {
    if (!window.__aosInit) { window.AOS.init({ once: true, duration: 450, offset: 40 }); window.__aosInit = true; }
    else window.AOS.refresh();
  } catch (e) { console.error('[aos]', e); }
}

function toast(msg) {
  try {
    if (window.Swal) {
      window.Swal.fire({
        toast: true, position: 'top', text: String(msg ?? ''), showConfirmButton: false,
        timer: 3200, timerProgressBar: false, background: '#1A1F1B', color: '#fff',
      });
      return;
    }
  } catch (e) { console.error('[toast]', e); }
  const t = document.createElement('div');
  t.className = 'sh-toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

function openSheet(html, onMount) {
  closeSheet();
  const bd = document.createElement('div');
  bd.className = 'backdrop';
  bd.id = 'sheet';
  bd.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  bd.addEventListener('click', (e) => { if (e.target === bd) closeSheet(); });
  document.body.appendChild(bd);
  onMount?.(bd.querySelector('.sheet'));
}
function closeSheet() { $('#sheet')?.remove(); }

async function invokeError(error, fallback) {
  if (!error) return fallback;
  try { const j = await error.context.json(); return j.error || fallback; } catch { return fallback; }
}

function translateAuthError(msg = '') {
  if (/Invalid login/i.test(msg)) return 'الإيميل أو كلمة السر غلط';
  if (/already registered/i.test(msg)) return 'الإيميل ده مسجل قبل كده، ادخل من الأول';
  if (/least 6/i.test(msg)) return 'كلمة السر لازم تكون 6 حروف على الأقل';
  if (/valid email/i.test(msg)) return 'اكتب إيميل صحيح';
  return msg || 'حصلت مشكلة، حاول تاني';
}

/* ============ الجلسة ============ */
async function loadProfile() {
  if (!session) { profile = null; return; }
  const { data } = await sb.from('profiles').select('id, full_name, phone, role').eq('id', session.user.id).maybeSingle();

}

/* ============ تحميل البيانات ============ */
async function loadRestaurants() {
  const { data, error } = await sb.from('restaurants')
    .select('id, name, slug, description, logo_url, cover_image_url, address, rating, delivery_fee, delivery_min_minutes, is_open, category_id, restaurant_categories(name, slug), restaurant_badge_assignments(is_active, starts_at, ends_at, display_text_override, style_override, badges(name, display_text, icon, background_color, text_color, border_color, shape, opacity, font_size_px, style_config, show_background, background_opacity, icon_position))')
    .order('rating', { ascending: false });
  if (error) { loadFail('restaurants', error); return []; }
  return data || [];
}
async function loadCategories() {
  const { data, error } = await sb.from('restaurant_categories').select('id, name, slug').eq('is_active', true).order('display_order');
  if (error) loadFail('categories', error);
  return data || [];
}
async function loadBanners() {
  const { data, error } = await sb.from('homepage_offer_banner_items')
    .select('id, display_order, starts_at, ends_at, restaurant_offers(id, title, description, image_url, restaurant_id, status, starts_at, ends_at)')
    .eq('is_active', true).order('display_order');
  if (error) loadFail('banners', error);
  const seen = new Set();
  return (data || [])
    .filter((x) => x.restaurant_offers && inWindow(x.starts_at, x.ends_at)
      && x.restaurant_offers.status === 'approved' && inWindow(x.restaurant_offers.starts_at, x.restaurant_offers.ends_at))
    .map((x) => x.restaurant_offers)
    .filter((o) => (seen.has(o.id) ? false : (seen.add(o.id), true)));
}
// أقسام الرئيسية التسويقية: جدول مستقل عن البلوكات، مع احترام التواريخ والتفعيل على مستوى القسم والعضوية
async function loadDiscoverySections() {
  const { data, error } = await sb.from('home_discovery_sections')
    .select(`
      id,
      slug,
      title,
      subtitle,
      image_url,
      display_order,
      starts_at,
      ends_at,
      home_discovery_section_restaurants (
        id,
        restaurant_id,
        display_order,
        is_active,
        starts_at,
        ends_at,
        restaurants (
          id,
          name,
          slug
        )
      )
    `)
    .eq('is_active', true)
    .order('display_order');
  if (error) { loadFail('discovery', error); return []; }
  const seenSec = new Set();
  return (data || [])
    .filter((s) => inWindow(s.starts_at, s.ends_at) && !seenSec.has(s.id) && seenSec.add(s.id))
    .map((s) => {
      const seenRest = new Set();
      return {
        ...s,
        members: (s.home_discovery_section_restaurants || [])
          .filter((m) => m.is_active !== false && inWindow(m.starts_at, m.ends_at))
          .sort((a, b) => (a.display_order ?? 0) - (b.display_order ?? 0))
          .filter((m) => !seenRest.has(m.restaurant_id) && seenRest.add(m.restaurant_id)),
      };
    });
}
// أنواع محتوى البلوك (restaurant_blocks.content_type). القيمة الفاضية/غير المعروفة بترجع لـ restaurants
const BLOCK_CONTENT_TYPES = ['restaurants', 'products', 'restaurant_products', 'restaurants_products', 'offers'];
const BLOCK_PRODUCT_TYPES = ['products', 'restaurant_products', 'restaurants_products'];
function blockContentType(bl) {
  return BLOCK_CONTENT_TYPES.includes(bl.content_type) ? bl.content_type : 'restaurants';
}
// منتجات البلوكات من block_product_items. استعلام منفصل عشان فشله ما يوقفش المطاعم ولا باقي البلوكات
async function loadBlockProducts(blockIds) {
  const map = new Map();
  if (!blockIds.length) return map;
  const { data, error } = await sb.from('block_product_items')
    .select('id, block_id, display_order, is_active, product:products(id, name, description, price, emoji, is_available, restaurant_id, product_badge_assignments(is_active, starts_at, ends_at, display_text_override, style_override, badges(name, display_text, icon, background_color, text_color, border_color, shape, opacity, font_size_px, style_config, show_background, background_opacity, icon_position)))')
    .in('block_id', blockIds)
    .order('display_order');
  if (error) { loadFail('block-products', error); return map; }
  const seenInBlock = new Set(); // المنتج مرة واحدة داخل نفس البلوك
  for (const row of [...(data || [])].sort((x, y) => (x.display_order ?? 0) - (y.display_order ?? 0))) {
    const p = row.product;
    if (row.is_active === false || !p || p.is_available === false) continue;
    if (!p.id || !p.name || !p.restaurant_id || p.price == null || !Number.isFinite(Number(p.price))) continue;
    const dk = row.block_id + '|' + p.id;
    if (seenInBlock.has(dk)) continue;
    seenInBlock.add(dk);
    if (!map.has(row.block_id)) map.set(row.block_id, []);
    map.get(row.block_id).push({
      id: p.id, name: p.name, description: p.description, price: p.price, emoji: p.emoji,
      restaurant_id: p.restaurant_id, display_order: row.display_order,
      product_badge_assignments: p.product_badge_assignments || [],
    });
  }
  return map;
}
async function loadBlocks(pageKey = 'home', categoryId = null) {
  const { data, error } = await sb.from('restaurant_blocks')
    .select('id, title, subtitle, display_order, background_color, text_color, card_style, design_settings, content_mode, content_type, brand_id, restaurant_id, max_items, logo_url, cover_image_url, badge_image_url, starts_at, ends_at, brand:restaurant_brands(name, logo_url, cover_image_url), badge:badges(name, display_text, icon, background_color, text_color, border_color, shape, opacity, font_size_px, style_config, show_background, background_opacity, icon_position), block_restaurant_overrides(restaurant_id, display_order, is_eligible, badge_text_override, badge_style_override, badge_starts_at, badge_ends_at, badge:badges(name, display_text, icon, background_color, text_color, border_color, shape, opacity, font_size_px, style_config, show_background, background_opacity, icon_position)), block_offer_items(id, display_order, is_active, starts_at, ends_at, restaurant_offers(id, title, description, image_url, status, starts_at, ends_at, restaurant_id))')
    .eq('is_visible', true).order('display_order');
  if (error) { loadFail('blocks', error); return []; }

  // اختيار المطاعم وترتيبها وحدها في Supabase؛ نفس الدالة تدعم الديناميكي واليدوي والبراند والمطعم الواحد.
  const rpc = await sb.rpc('get_public_restaurant_block_members', {
    p_page_key: pageKey,
    p_category_id: pageKey === 'category' ? categoryId : null,
    p_limit: 30,
  });
  const memberMap = new Map();
  if (!rpc.error && Array.isArray(rpc.data)) {
    for (const row of rpc.data) memberMap.set(row.block_id, Array.isArray(row.members) ? row.members : []);
  } else {
    loadFail('block-members', rpc.error || new Error('تعذّر تحميل أعضاء البلوكات'));
  }

  const productMap = await loadBlockProducts((data || []).filter((b) => BLOCK_PRODUCT_TYPES.includes(b.content_type)).map((b) => b.id));
  console.info('[Sahap Blocks]', { pageKey, categoryId, blocksCount: (data || []).length, membersLoaded: memberMap.size, productBlocks: productMap.size });

  return (data || []).filter((b) => inWindow(b.starts_at, b.ends_at)).map((b) => {
    // الدالة بترجّع بيانات شارة مختصرة؛ لو الصف نفسه ظاهر في block_restaurant_overrides ناخد منه الشارة الكاملة (شكل/أيقونة/شفافية)
    const ovByRest = new Map((b.block_restaurant_overrides || []).map((o) => [o.restaurant_id, o]));
    const members = memberMap.has(b.id)
      ? memberMap.get(b.id).map((m) => {
        const o = ovByRest.get(m.restaurant_id);
        return o && o.badge ? { ...m, badge: o.badge } : m;
      })
      : (b.content_mode === 'manual'
        ? (b.block_restaurant_overrides || [])
          .filter((o) => o.is_eligible !== false)
          .sort((x, y) => (x.display_order ?? 0) - (y.display_order ?? 0))
        : []); // الديناميكي بيعتمد على الدالة بس؛ ما نرجعش لـ overrides لو الدالة ما رجعتش صف للبلوك
    const seenOffer = new Set();
    return {
      ...b,
      products: productMap.get(b.id) || [],
      members,
      offers: (b.block_offer_items || [])
        .filter((x) => x.is_active !== false && inWindow(x.starts_at, x.ends_at) && x.restaurant_offers)
        .filter((x) => x.restaurant_offers.status === 'approved' && inWindow(x.restaurant_offers.starts_at, x.restaurant_offers.ends_at))
        .sort((x, y) => (x.display_order ?? 0) - (y.display_order ?? 0))
        .filter((x) => !seenOffer.has(x.restaurant_offers.id) && seenOffer.add(x.restaurant_offers.id))
        .map((x) => ({ ...x.restaurant_offers, display_order: x.display_order })),
    };
  });
}
async function loadLayout(pageKey, categoryId = null) {
  // ترتيب الصفحة من homepage_layout_items. التصنيف بيتحمّل بمعرفه الحقيقي (category_id) بس
  if (pageKey === 'category' && !categoryId) return [];
  const { data, error } = await sb.rpc('get_public_homepage_layout', {
    p_page_key: pageKey,
    p_category_id: pageKey === 'category' ? categoryId : null,
  });
  if (error) { loadFail('layout:' + pageKey, error); return []; }
  if (!Array.isArray(data)) return [];
  return data.map((x) => ({
    id: x.id,

// الإعلانات المؤهلة فقط، من دالة على السيرفر تُرجع حقول العرض بس (بدون ميزانية أو أسعار)
// تحويل الجرد العام (placement + campaigns) لنفس شكل الحملة اللي الواجهة بتعرضه
function adsFromInventory(rows) {
  const map = new Map();
  for (const p of rows) {
    const code = p.placement_code;
    if (!code) continue;
    const list = (p.campaigns || []).map((c) => ({
      placement_code: code,
      campaign_id: c.campaign_id,
      creative_title: c.creative_title || c.title,
      creative_text: c.creative_text,
      creative_format: c.creative_format,
      creative_image_url: c.image_url || c.creative_image_url,
      target_url: c.target_url,
      restaurant_id: c.restaurant_id,
      restaurant_name: c.restaurant_name,
      restaurant_slug: c.restaurant_slug,
    }));
    if (list.length) map.set(code, list);
  }
  return map;
}
async function loadAds() {
  const inv = await sb.rpc('get_public_ad_inventory');
  if (!inv.error && Array.isArray(inv.data)) return adsFromInventory(inv.data);
  // الرجوع للدالة القديمة لو الجرد مش متاح
  const { data, error } = await sb.rpc('get_eligible_ads');
  if (error || !data) return new Map();
  const map = new Map();
  for (const a of data) {
    if (!map.has(a.placement_code)) map.set(a.placement_code, []);
    map.get(a.placement_code).push(a);
  }
  return map;
}
async function loadMethods(restaurantId) {
  const { data } = await sb.rpc('get_payment_methods', { p_restaurant_id: restaurantId });
  return data || { cash: false, paymob: false };
}

// نتيجة تحميل مستقل: لو فشل بنرجع الافتراضي ونسجل الخطأ في الـconsole بدل ما نوقف الصفحة

}

// قيم الألوان بتتفلتر: hex أو rgb/hsl أو اسم لون بسيط بس، أي قيمة تانية بترجع للافتراضي

function badgeIconHtml(icon) {

// مطاعم البلوك بالترتيب، كل مطعم مرة واحدة داخل نفس البلوك بس (من غير منع بين البلوكات)

// المطاعم المنشورة بمعرفها: بنستخدمها لشعار المطعم في الإعلان المميز (من نفس البيانات المحمّلة، بدون استعلام إضافي)

const AD_FORMATS = ['hero', 'horizontal', 'square', 'vertical', 'featured'];

/* ===== تسجيل الظهور والنقر (CPM / CPC) ===== */
let viewSeq = 0; // رقم كل عرض للصفحة، عشان الظهور يتسجل مرة واحدة لكل زيارة
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
const newEventKey = () => (crypto && crypto.randomUUID
  ? crypto.randomUUID()
  : 'ev-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2));
const SESSION_RAW = newEventKey(); // معرف جلسة عشوائي لكل تحميل صفحة، من غير أي بيانات شخصية
let sessionHashP = null;
function sessionHash() {
  if (!sessionHashP) sessionHashP = (async () => {
    try {
      if (crypto && crypto.subtle) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(SESSION_RAW));
        return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join('');
      }
    } catch (_) {}
    return SESSION_RAW;
  })();
  return sessionHashP;
}
// نفس event_key في كل إعادة محاولة، والأخطاء ما بتعطلش الموقع
async function sendAdEvent(fn, params, attempts = 3) {
  for (let i = 0; i < attempts; i++) {
    try {
      const { error } = await sb.rpc(fn, params);
      if (!error) return true;
    } catch (_) {}
    await new Promise((r) => setTimeout(r, 500 * 2 ** i));
  }
  return false;
}

const recordedImpressions = new Set();
const impressionIO = ('IntersectionObserver' in window) ? new IntersectionObserver((entries) => {
  for (const e of entries) {
    const el = e.target;
    el.__ratio = e.intersectionRatio;
    if (el.dataset.impressionDone) continue;
    if (e.intersectionRatio >= 0.5) {
      if (!el.__timer) el.__timer = setTimeout(() => { el.__timer = null; fireImpression(el); }, 1000);
    } else if (el.__timer) {
      clearTimeout(el.__timer);
      el.__timer = null;
    }
  }
}, { threshold: [0, 0.25, 0.5, 0.75, 1] }) : null;

async function fireImpression(el) {
  if (el.dataset.impressionDone || !el.isConnected) return;
  const pct = Math.round((el.__ratio || 0) * 100);
  if (pct < 50) return;
  const campaignId = el.dataset.campaignId;
  if (!UUID_RE.test(campaignId || '')) return;
  const dedupe = `${el.dataset.view}|${el.dataset.placement}|${campaignId}`;
  el.dataset.impressionDone = '1';
  impressionIO.unobserve(el);
  if (recordedImpressions.has(dedupe)) return;
  recordedImpressions.add(dedupe);
  const params = {
    p_campaign_id: campaignId,
    p_session_hash: await sessionHash(),
    p_visible_percent: pct,
    p_event_key: newEventKey(),
  };
  sendAdEvent('track_ad_impression', params);
}

function observeAds(root = document) {
  if (!impressionIO || !root) return;
  root.querySelectorAll('.ad[data-campaign-id]').forEach((el) => {
    if (el.dataset.impressionDone) return;
    el.dataset.view = String(viewSeq);
    impressionIO.observe(el);
  });
}

/* ===== تتبع ظهور ونقر مطاعم البلوكات (track_block_impression / track_block_click) =====
   عقد الدالتين (من تعريفهما في Supabase): p_block_id uuid، p_restaurant_id uuid، p_session_hash text (8 حروف على الأقل)،
   p_event_key text، وللظهور p_visible_percent بين 50 و100. الدالتان بترفضا أي مطعم مش موجود في block_restaurant_overrides.
   الفشل ما بيأثرش على التنقل ولا على عرض البلوك، ومحاولات الإعادة بس لأخطاء الشبكة. */
const blockSeen = new Set();      // ظهور واحد لكل (بلوك، مطعم) في الجلسة، زي قيد قاعدة البيانات
const blockRejected = new Set();  // أحداث رفضتها الدالة (نوع الحدث + بلوك + مطعم): ما نعيدش إرسالها بس
const blockClicked = new Set();
const blockTimers = new Set();
async function sendBlockEvent(fn, params) {
  // المفتاح يشمل نوع الحدث: رفض Impression ما يمنعش Click والعكس
  const key = fn + '|' + params.p_block_id + '|' + params.p_restaurant_id;
  if (blockRejected.has(key)) return false;
  for (let i = 0; i < 3; i++) {
    try {
      const { error, status } = await sb.rpc(fn, params);
      if (!error) return true;
      // رفض دائم من قاعدة البيانات (4xx غير 429 وله code): ما نكررش نفس الحدث
      const transient = status === 429 || (status && status >= 500) || !error.code;
      if (!transient) {
        blockRejected.add(key);
        console.warn('[block-track]', fn, error.code, error.message);
        return false;
      }
      // Rate limit أو خطأ مؤقت: نعيد المحاولة بنفس event_key
    } catch (_) { /* شبكة: نعيد المحاولة */ }
    await new Promise((r) => setTimeout(r, 500 * 2 ** i));
  }
  return false; // فشل التتبع لا يأثر على عرض البلوك ولا على التنقل
}
async function fireBlockImpression(el) {
  if (!el.isConnected || el.dataset.blkDone) return;
  const pct = Math.round((el.__ratio || 0) * 100);
  if (pct < 50) return;
  const blockId = el.dataset.blockId, restId = el.dataset.restaurantId;
  if (!UUID_RE.test(blockId || '') || !UUID_RE.test(restId || '')) return;
  el.dataset.blkDone = '1';
  blockIO && blockIO.unobserve(el);
  const pair = blockId + '|' + restId;
  if (blockSeen.has(pair)) return;
  blockSeen.add(pair);
  sendBlockEvent('track_block_impression', {
    p_block_id: blockId,
    p_restaurant_id: restId,
    p_session_hash: await sessionHash(),
    p_visible_percent: Math.min(100, Math.max(50, pct)),
    p_event_key: `blkimp:${SESSION_RAW}:${pair}`,
  });
}
const blockIO = ('IntersectionObserver' in window) ? new IntersectionObserver((entries) => {
  for (const e of entries) {
    const el = e.target;
    el.__ratio = e.intersectionRatio;
    if (el.dataset.blkDone) continue;
    if (e.intersectionRatio >= 0.5) {
      if (!el.__blkTimer) {
        el.__blkTimer = setTimeout(() => { el.__blkTimer = null; blockTimers.delete(el); fireBlockImpression(el); }, 1000);
        blockTimers.add(el);
      }
    } else if (el.__blkTimer) {
      clearTimeout(el.__blkTimer); el.__blkTimer = null; blockTimers.delete(el);
    }
  }
}, { threshold: [0, 0.25, 0.5, 0.75, 1] }) : null;
function observeBlocks(root = document) {
  if (!blockIO || !root) return;
  root.querySelectorAll('a.rcard[data-block-id]').forEach((el) => { if (!el.dataset.blkDone) blockIO.observe(el); });
}
function stopBlockTracking() {
  for (const el of blockTimers) { clearTimeout(el.__blkTimer); el.__blkTimer = null; }
  blockTimers.clear();
  if (blockIO) blockIO.disconnect();
}
document.addEventListener('click', (e) => {
  const a = e.target && e.target.closest ? e.target.closest('a.rcard[data-block-id]') : null;
  if (!a) return; // التنقل بيكمل عادي، التسجيل في الخلفية
  const blockId = a.dataset.blockId, restId = a.dataset.restaurantId;
  if (!UUID_RE.test(blockId || '') || !UUID_RE.test(restId || '')) return;
  const key = `${viewSeq}|${blockId}|${restId}`;
  if (blockClicked.has(key)) return;
  blockClicked.add(key);
  sessionHash().then((h) => sendBlockEvent('track_block_click', {
    p_block_id: blockId, p_restaurant_id: restId, p_session_hash: h, p_event_key: `blkclk:${SESSION_RAW}:${key}`,
  })).catch(() => {});
});

// النقر: يسجل ولا يمنع التنقل (الروابط الداخلية والخارجية زي ما هي)
// النقرة تُحتسب مرة واحدة لكل حملة في كل عرض للصفحة، والضغط المتكرر ما بيخصمش تاني
const clickedKeys = new Set();
document.addEventListener('click', (e) => {
  const a = e.target && e.target.closest ? e.target.closest('a.ad[data-campaign-id]') : null;
  if (!a) return;
  const campaignId = a.dataset.campaignId;
  if (!UUID_RE.test(campaignId || '')) return;
  const viewKey = `${a.dataset.view || viewSeq}|${campaignId}`;
  if (clickedKeys.has(viewKey)) return;
  clickedKeys.add(viewKey);
  const eventKey = `click:${SESSION_RAW}:${viewKey}`;
  sessionHash().then((h) => sendAdEvent('track_ad_click', {
    p_campaign_id: campaignId,
    p_session_hash: h,
    p_event_key: eventKey,
  }, 2));
});

// ترتيب الصفحة من homepage_layout_items (الإعلانات بتتعرض في موضعها)
// skipCodes: مواضع بتتعرض في مكان محدد بره الترتيب
// التخطيط هو المصدر الوحيد: البلوك اللي مش في التخطيط ما يتعرضش أبداً
function layoutTokens(layout, blocks, byId, ads, skipCodes = new Set(), used = null) {
  const blockById = new Map(blocks.map((b) => [b.id, b]));
  return layout.map((it) => {
    if (it.item_type === 'restaurant_block') {
      const bl = blockById.get(it.block_id);
      return bl ? { html: blockHtml(blockPlacementConfig(bl, it), byId) } : null;
    }
    if (it.item_type === 'ad_banner') {
      const code = it.ad_placements && it.ad_placements.code;
      if (!code || skipCodes.has(code)) return null;
      return { ads: used ? pickAds(ads, code, used) : (ads.get(code) || []) };
    }
    return null;
  });
}

// تجميع الإعلانات المتتالية في Slider واحد.
// البلوك الفاضي (أو الموضع اللي مفيهوش إعلانات) مش فاصل، فالإعلانات اللي حواليه بتتجمع.
// البلوك اللي فيه مطاعم فعلية بيقطع المجموعة. ما بنحذفش ولا بنغيّر أي إعلان.
function groupSequence(tokens, wrapAds = (h) => h) {
  const parts = [];
  let pending = null;
  const flush = () => {
    if (pending && pending.length) parts.push(wrapAds(adsHtml(pending)));
    pending = null;
  };
  for (const t of tokens) {
    if (!t) continue;
    if (t.ads) {
      if (!pending) pending = [];
      pending.push(...t.ads);
      continue;
    }
    if (t.html) { flush(); parts.push(t.html); }
  }
  flush();
  return parts;
}

  [/^checkout\/([^/]+)$/, viewCheckout, false, ''],
  [/^s\/([^/]+)$/, viewGroup, false, ''],
  [/^orders$/, viewOrders, true, 'orders'],
  [/^account$/, viewAccount, true, 'account'],
  [/^login$/, viewLogin, false, ''],
];

function route() {
  clearInterval(pollTimer);
  clearInterval(rotTimer);
  destroyHomeSwiper();
  destroyAdSliders();
  if (impressionIO) impressionIO.disconnect(); // المراقبة القديمة ما تكملش بعد مغادرة الصفحة
  stopBlockTracking();
  resetLoadErrors();
  closeSheet();
  cartbar.classList.add('hidden');
  const raw = location.hash.replace(/^#\/?/, '');
  const path = raw.split('?')[0];
  const ret = sessionStorage.getItem(RET_KEY);
  if (session && ret && (path === '' || path === 'home' || path === 'login')) {
    sessionStorage.removeItem(RET_KEY);
    location.hash = ret;
    return;
  }
  refreshCartSummary().then(updateCartBtns);
  document.body.dataset.page = (path === '' || path === 'home') ? 'home' : (/^r\//.test(path) ? 'restaurant' : 'inner');
  const query = new URLSearchParams(raw.split('?')[1] || '');
  document.querySelectorAll('.tabbar a').forEach((a) => a.removeAttribute('aria-current'));

  for (const [re, fn, needsAuth, tab] of ROUTES) {
    const m = path.match(re);
    if (!m) continue;
    if (needsAuth && !session) { goLogin(); return; }
    if (tab) document.querySelector(`.tabbar a[data-tab="${tab}"]`)?.setAttribute('aria-current', 'page');
    if (fn === viewRestaurants) fn(query);
    else if (fn === viewRestaurant) fn([m[0], decodeURIComponent(m[1])], query);
    else if (fn === viewGroup || fn === viewCart || fn === viewCheckout) fn([m[0], decodeURIComponent(m[1])]);
    else fn();
    return;
  }
  location.hash = '#/home';
}
window.addEventListener('hashchange', route);

// الضغط على الكارت بيفتح شاشة القسم بكل مطاعمه
function mktStripHtml(sections, byId) {
  const cards = sections.map((sec) => {
    const first = sec.members.map((m) => byId.get(m.restaurant_id)).find(Boolean);
    if (!first) return ''; // قسم مفيهوش مطاعم منشورة

    return `<a class="mkt-card" href="#/s/${esc(sec.id)}" aria-label="${esc(sec.title)}">
      ${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : `<span class="mkt-card-fb" aria-hidden="true">${letter}</span>`}
      <span class="mkt-card-t"><strong class="mkt-card-n">${esc(sec.title)}</strong>${sec.subtitle ? `<span class="mkt-card-o">${esc(sec.subtitle)}</span>` : ''}</span>

}

/* ============ قائمة المطاعم والتصنيفات ============ */
// المطاعم تُربط بالتصنيف عبر restaurants.category_id ← restaurant_categories.id (الـ join في loadRestaurants)
// الإعلانات: «الكل» ← restaurants_top / restaurants_between_*
//            تصنيف محدد ← category_top / category_between_*
// توزيع اللافتات داخل القائمة بالتساوي حسب ترتيب التخطيط (display_order)، ومن غير أرقام ثابتة
// توزيع المطاعم بين البلوكات واللافتات حسب ترتيب التخطيط: عنصر ثم مجموعة مطاعم،
// من غير ما يتجمع بلوكين أو لافتتين جنب بعض. القائمة بتعرض كل المطاعم المطابقة (زي تصنيف الكل).
function sequenceHtml(items, list, blocksById, ads, used, allRests = list, scope = null) {
  // المطاعم بتتحل من القائمة الكاملة المنشورة (مش المفلترة)، عشان البلوك ما يختفيش لو مطعمه برّه الفلتر
  const byId = new Map(allRests.map((r) => [r.id, r]));
  const tokens = [];
  for (const it of items) {
    if (it.item_type === 'restaurant_block') {
      const bl = blocksById.get(it.block_id);
      if (!bl) continue;
      const html = blockHtml(blockPlacementConfig(bl, it), byId, true, scope);
      if (html) tokens.push({ html: `<div class="col-12">${html}</div>` });
    } else if (it.item_type === 'ad_banner') {
      const code = it.ad_placements?.code;
      if (code) tokens.push({ ads: pickAds(ads, code, used) });
    }
  }
  const parts = groupSequence(tokens, (h) => `<div class="col-12">${h}</div>`);
  // القائمة بتعرض كل المطاعم المطابقة (حتى اللي ظاهرة في بلوك فوق)، والتصنيف ما بيأثرش على «الكل»
  const rest = list;
  const n = parts.length;
  const cut = (i) => Math.floor((i * rest.length) / (n + 1));
  const rows = (from, to) => rest.slice(from, to).map((r) => `<div class="col-12 col-md-6 col-lg-4">${restRowHtml(r)}</div>`).join('');
  if (!n) return rows(0, rest.length);
  let out = '';
  for (let i = 0; i < n; i++) out += parts[i] + rows(cut(i), cut(i + 1));
  return out + rows(cut(n), rest.length);
}

// يرجّع الإعلانات المؤهلة للموضع، ويستبعد أي حملة ظهرت قبل كده في نفس الصفحة
// إعلانات التصنيف: بس الحملات اللي مطعمها موجود في التصنيف ده
function scopeAds(map, restIds) {
  const out = new Map();
  for (const [code, list] of map) {
    const f = list.filter((a) => restIds.has(a.restaurant_id));
    if (f.length) out.set(code, f);
  }
  return out;
}
function pickAds(ads, code, used) {
  return (ads.get(code) || []).filter((a) => {
    const key = a.campaign_id || a;
    if (used.has(key)) return false;
    used.add(key);
    return true;
  });
}

async function viewRestaurants(query) {
  const my = ++rid;
  viewSeq++;
  app.innerHTML = `${topbar('المطاعم')}

    </div>
    <div id="list" class="row g-3"><div class="col-12"><p class="meta">جاري التحميل…</p></div></div>`;

  const settledRest = await Promise.allSettled([
    loadRestaurants(), loadCategories(), loadBlocks('restaurants'), loadLayout('restaurants'), loadAds(),
  ]);
  if (my !== rid) return;
  const [rests, cats, blocks, restLayout, ads] = settledRest.map((x, i) =>
    fulfilledOr(x, [[], [], [], [], new Map()][i], 'restaurants'));
  restIndex = new Map(rests.map((r) => [r.id, r]));
  if (loadErrors.length && rests.length) toast(LOAD_FAIL_TXT);

  // التصنيف من الرابط لازم يكون نشط وموجود؛ غير كده نرجع لـ«الكل»
  const catBySlug = new Map(cats.map((c) => [c.slug, c]));
  let active = catBySlug.has(query.get('c') || '') ? query.get('c') : '';
  if ((query.get('c') || '') !== active) {
    history.replaceState(null, '', '#/restaurants');
  }

  // «الكل»: بلوكات المطاعم ولافتات restaurants_* فقط من تخطيط المطاعم
  const restPage = restLayout.filter((it) =>
    it.item_type === 'restaurant_block' ||
    (it.item_type === 'ad_banner' && /^restaurants_/.test(it.ad_placements?.code || '')));

  // تصنيف محدد: تخطيطه يُحمَّل بمعرف التصنيف الحقيقي، ولا يرث بلوكات الرئيسية أو المطاعم
  // كل تصنيف ليه تخطيطه المخزن بمعرفه؛ الطلب المتزامن لنفس التصنيف ما بيتكررش
  const catLayouts = new Map();     // category id -> عناصر التخطيط
  const catBlocks = new Map();      // category id -> أعضاء البلوكات الخاصة بالتصنيف
  const catLayoutLoads = new Map(); // category id -> طلب جاري
  const ensureCatLayout = async () => {
    const cat = active ? catBySlug.get(active) : null;
    if (!cat || catLayouts.has(cat.id)) return;
    if (!catLayoutLoads.has(cat.id)) {
      catLayoutLoads.set(cat.id, Promise.all([
        loadLayout('category', cat.id),
        loadBlocks('category', cat.id),
      ]).then(([lay, categoryBlockRows]) => {
        catLayouts.set(cat.id, lay.filter((it) =>
          it.item_type === 'restaurant_block' ||
          (it.item_type === 'ad_banner' && /^category_/.test(it.ad_placements?.code || ''))));
        catBlocks.set(cat.id, categoryBlockRows);
      }).finally(() => catLayoutLoads.delete(cat.id)));
    }
    try { await catLayoutLoads.get(cat.id); } catch (e) { loadFail('category-layout', e); }
  };
  await ensureCatLayout();
  if (my !== rid) return;

  const matches = (r, term) =>
    (!active || r.restaurant_categories?.slug === active) &&
    (!term || (r.name || '').toLowerCase().includes(term));

  const drawChips = () => {
    $('#cats').innerHTML = !cats.length ? '' : `<button class="chip" data-c="" aria-pressed="${active === ''}">الكل</button>` +
      cats.map((c) => `<button class="chip" data-c="${esc(c.slug)}" aria-pressed="${active === c.slug}">${esc(c.name)}</button>`).join('');
  };

  const render = () => {
    if (!$('#list')) return; // الصفحة اتغيرت
    destroyAdSliders(); // السلايدرات القديمة بتتعمل قبل إعادة الرسم
    const term = $('#s').value.trim().toLowerCase();
    const list = rests.filter((r) => matches(r, term));
    const used = new Set(); // كل حملة تظهر مرة واحدة في الصفحة
    let items;
    // في التصنيف: إعلاناته هي بس (مطاعم التصنيف). في «الكل»: كل الإعلانات
    let adsView = ads;
    if (active) {
      const ids = new Set(rests.filter((r) => r.restaurant_categories?.slug === active).map((r) => r.id));
      adsView = scopeAds(ads, ids);
    }

    if (active) {
      const cat = catBySlug.get(active);
      // لو التخطيط مش محمّل للتصنيف ده بالظبط ما نعرضش أي لافتة (ولا لافتات تصنيف تاني)
      const lay = cat && catLayouts.has(cat.id) ? catLayouts.get(cat.id) : [];
      const hasTop = lay.some((it) => it.ad_placements?.code === 'category_top');
      $('#top-ads').innerHTML = hasTop ? rotHtml(pickAds(adsView, 'category_top', used)) : '';
      items = lay.filter((it) => it.ad_placements?.code !== 'category_top');
    } else {
      $('#top-ads').innerHTML = rotHtml(pickAds(ads, 'restaurants_top', used));
      items = restPage.filter((it) => it.ad_placements?.code !== 'restaurants_top');
    }

    const activeCat = active ? catBySlug.get(active) : null;
    const visibleBlocks = activeCat ? (catBlocks.get(activeCat.id) || []) : blocks;
    const blocksById = new Map(visibleBlocks.map((b) => [b.id, b]));
    const emptyTxt = term ? 'مفيش مطعم يطابق بحثك'
      : active ? 'مفيش مطاعم في التصنيف ده دلوقتي'
      : 'مفيش مطاعم متاحة دلوقتي';
    const listHtml = sequenceHtml(items, list, blocksById, adsView, used, rests, activeCat ? { categoryId: activeCat.id } : null);
    // القائمة الفاضية ما بتمنعش البلوكات الصالحة من الظهور (إلا لو فيه بحث نشط)
    const hasBlock = !term && listHtml.includes('sh-custom-block');
    $('#list').innerHTML = (list.length || hasBlock) ? listHtml : `<div class="col-12">${loadErrors.length && !rests.length ? loadErrorHtml() : emptyHtml(emptyTxt)}</div>`;
    // عنوان الصفحة بيوضح التصنيف المختار، عشان المستخدم يعرف هو فين
    const titleEl = app.querySelector('.topbar .ttl');
    if (titleEl) titleEl.textContent = active ? (catBySlug.get(active)?.name || 'المطاعم') : 'المطاعم';
    observeAds($('#top-ads'));
    observeAds($('#list'));
    stopBlockTracking(); // إعادة الرسم: نبدأ مراقبة العناصر الجديدة بس، والظهور المسجل قبل كده ما بيتكررش
    observeBlocks($('#list'));
    mountAdSliders($('#top-ads'));
    mountAdSliders($('#list'));
    aosRefresh();
  };

  drawChips();
  render();
  observeAds(app);
  $('#s').addEventListener('input', render);
  $('#cats').addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-c]');
    if (!b) return;
    active = b.dataset.c;
    const wanted = active;
    // نحدّث الرابط بدون إعادة تحميل، فالتصنيف يفضل محفوظ عند الريفرش أو عند فتح الرابط
    history.replaceState(null, '', active ? `#/restaurants?c=${encodeURIComponent(active)}` : '#/restaurants');
    drawChips();
    await ensureCatLayout();
    if (my !== rid || active !== wanted) return; // المستخدم غيّر التصنيف تاني أثناء التحميل
    render();
  });
}

/* ============ صفحة المطعم والسلة ============ */
const CART_READ_FAIL = 'تعذّر تحميل السلة، حاول تاني';
const CART_WRITE_FAIL = 'تعذّر تحديث السلة، حاول تاني';
const CART_MAX_QTY = 99;
function cartError(msg, cause) { const e = new Error(msg); e.cause = cause; return e; }

// قراءة السلة: أي خطأ في الاستعلام بيترمي (مش بيتحول لسلة فاضية).
// السلة بتتعمل بس لو مفيش سلة نشطة فعلاً وطلبنا إنشاءها.
async function getCart(restaurantId, create) {
  if (!session) throw cartError('سجّل دخولك الأول');
  const uid = session.user.id;
  const findActive = () => sb.from('carts').select('id, coupon_code')
    .eq('customer_id', uid).eq('restaurant_id', restaurantId).eq('status', 'active').maybeSingle();

  const sel = await findActive();
  if (sel.error) throw cartError(CART_READ_FAIL, sel.error);
  let cart = sel.data;

  if (!cart && create) {
    const ins = await sb.from('carts').insert({ customer_id: uid, restaurant_id: restaurantId })
      .select('id, coupon_code').single();
    if (ins.error) {
      // 23505 = سلة نشطة اتعملت في نفس اللحظة من تبويب تاني: نقرأها بدل ما نفشل
      if (ins.error.code !== '23505') throw cartError(CART_WRITE_FAIL, ins.error);
      const again = await findActive();
      if (again.error) throw cartError(CART_READ_FAIL, again.error);
      cart = again.data;
    } else {
      cart = ins.data;
    }
    if (!cart) throw cartError(CART_READ_FAIL);
  }
  if (!cart) return null;

  const items = await sb.from('cart_items').select('id, product_id, quantity').eq('cart_id', cart.id);
  if (items.error) throw cartError(CART_READ_FAIL, items.error);
  return { id: cart.id, coupon_code: cart.coupon_code, items: items.data || [] };
}

// تحميل السلة لصفحة المطعم: الفشل مش بيوقف الصفحة، بس بيتعلّم إن الكميات مش موثوقة
async function loadCartSafe(restaurantId) {
  if (!session) return { cart: guestCartFor(restaurantId), failed: false };
  try {
    return { cart: await getCart(restaurantId, false), failed: false };
  } catch (e) {
    console.error('[cart-load]', e);
    return { cart: null, failed: true };
  }
}

function drawMenu() {
